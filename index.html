<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMOS.LAB STUDIO</title>
    <style>
        /* --- TEMEL AYARLAR --- */
        body { background-color: #0e0e0e; color: #f0f0f0; font-family: 'Courier New', Courier, monospace; margin: 0; overflow-x: hidden; touch-action: pan-y; }
        
        header { 
            padding: 2rem 3rem; width: 100%; box-sizing: border-box;
            position: sticky; top: 0; background: rgba(14, 14, 14, 0.95); z-index: 100; 
            display: flex; justify-content: space-between; border-bottom: 1px solid #333; 
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -2px; }
        nav a { color: #888; text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: #fff; }

        section { padding: 2rem 0; max-width: 70%; margin: 0 auto; scroll-margin-top: 100px; }
        h2 { font-size: 1.8rem; margin-bottom: 1rem; border-left: 4px solid #fff; padding-left: 15px; text-transform: uppercase; }
        p { color: #aaa; max-width: 800px; line-height: 1.6; margin-bottom: 1.5rem; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-bottom: 30px; }

        /* --- SLIDER --- */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .slider-wrapper { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide-item { 
            min-width: 700px; display: flex; flex-direction: column;
            position: relative; cursor: pointer; border: 1px solid #333; background: #000;
            transition: border-color 0.3s; flex-shrink: 0; 
            scroll-snap-align: start; scroll-snap-stop: always;
        }
        .slide-item:hover { border-color: #fff; }
        
        .slide-media { width: 100%; height: 500px; object-fit: contain; display: block; background-color: #000; }
        
        .caption { 
            width: 100%; background: #151515; padding: 20px; font-size: 1rem; 
            color: #ccc; border-top: 1px solid #222; box-sizing: border-box; font-weight: bold; letter-spacing: 1px;
        }
        .slide-item:hover .caption { color: #fff; }

        .slider-btn { 
            position: absolute; top: 250px; transform: translateY(-50%); 
            background: rgba(0,0,0,0.9); color: #fff; border: 1px solid #555; 
            width: 50px; height: 50px; cursor: pointer; z-index: 50; 
            font-size: 24px; display: flex; align-items: center; justify-content: center;
        }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        /* --- LIGHTBOX --- */
        .lightbox { 
            display: none; position: fixed; z-index: 9999; 
            top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #000; overflow: hidden; 
        }

        .lb-stage {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            touch-action: none; /* Önemli: Tarayıcı zoomunu kapat */
        }

        .lb-main-media { 
            max-width: 100%; max-height: 100%; 
            object-fit: contain;
            /* Transition SADECE transform değiştiğinde değil, genel akışta */
            /* JS ile kontrol edeceğiz, buraya transition koyarsak pan yaparken kasar */
            transform-origin: 0 0; /* Sol üst köşeden hesapla (Daha stabil matematik için) */
            user-select: none; -webkit-user-drag: none;
        }
        
        video.lb-main-media { z-index: 10; }

        .lb-ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
        }
        
        .lb-arrow { 
            position: absolute; top: 50%; transform: translateY(-50%);
            color: #fff; font-size: 50px; cursor: pointer; padding: 20px; 
            pointer-events: auto; text-shadow: 0 0 10px #000;
            background: rgba(0,0,0,0.2); border-radius: 5px;
        }
        .lb-prev-arrow { left: 10px; } .lb-next-arrow { right: 10px; }
        
        .close-lb { 
            position: absolute; top: 20px; right: 20px; 
            color: #fff; font-size: 40px; cursor: pointer; pointer-events: auto; 
            text-shadow: 0 0 10px #000; z-index: 30;
        }
        
        .rotate-btn {
            display: none; /* Sadece mobilde */
            position: absolute; top: 25px; right: 80px; 
            color: #fff; font-size: 30px; cursor: pointer; pointer-events: auto;
            border: 1px solid #fff; border-radius: 50%; width: 40px; height: 40px;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); z-index: 30;
        }

        .lb-counter { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #aaa; font-size: 0.9rem; letter-spacing: 2px; 
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px;
        }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) { 
            header { padding: 2rem 1rem; width: 100%; }
            section { max-width: 90%; } 
            .info-grid { grid-template-columns: 1fr; gap: 30px; }
            .slide-item { min-width: 90vw; width: 90vw; margin-right: 15px; } 
            .slide-media { height: 300px; }
            .slider-btn { display: none; }
            .rotate-btn { display: flex; }
            .lb-arrow { font-size: 30px; padding: 15px; } 
        }

    </style>
</head>
<body>

    <header>
        <div class="logo" id="logo"></div>
        <nav id="menu"></nav>
    </header>

    <section id="about-section">
        <div class="info-grid">
            <div>
                <h2 id="who-title"></h2>
                <p id="who-text"></p>
            </div>
            <div>
                <h2 id="what-title"></h2>
                <p id="what-text"></p>
            </div>
        </div>
    </section>

    <section id="projects-section">
        <h2>SELECTED PROJECTS</h2>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('project-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="project-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('project-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="automation-section">
        <h2 id="auto-title"></h2>
        <p id="auto-desc"></p>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('auto-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="auto-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('auto-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="contact-section" style="border-top: 1px solid #333; margin-top: 30px;">
        <h2>CONTACT</h2>
        <p id="contact-info"></p>
    </section>

    <div class="lightbox" id="lightbox">
        <div class="lb-stage" id="lb-stage">
            </div>

        <div class="lb-ui-layer">
            <span class="close-lb" onclick="closeLightbox()">&times;</span>
            <div class="rotate-btn" onclick="toggleRotation()">&#8635;</div>
            <div class="lb-arrow lb-prev-arrow" onclick="changeSlide(-1)">&#10094;</div>
            <div class="lb-arrow lb-next-arrow" onclick="changeSlide(1)">&#10095;</div>
            <div class="lb-counter" id="lb-counter"></div>
        </div>
    </div>

    <script src="content.js"></script>
    <script>
        // --- DATA LOADER ---
        document.getElementById('logo').innerText = siteContent.header.title;
        const nav = document.getElementById('menu');
        siteContent.header.menu.forEach(item => {
            nav.innerHTML += `<a href="${item.link}">${item.text}</a>`;
        });
        document.getElementById('who-title').innerText = siteContent.about.whoWeAreTitle;
        document.getElementById('who-text').innerText = siteContent.about.whoWeAreText;
        document.getElementById('what-title').innerText = siteContent.about.whatWeDoTitle;
        document.getElementById('what-text').innerText = siteContent.about.whatWeDoText;
        document.getElementById('auto-title').innerText = siteContent.automation.title;
        document.getElementById('auto-desc').innerText = siteContent.automation.description;
        document.getElementById('contact-info').innerHTML = `${siteContent.contact.email}<br>${siteContent.contact.location}`;

        let allImages = []; 

        function isVideo(url) { return url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.webm'); }
        function isMobile() { return window.innerWidth <= 768; }

        function renderSlider(wrapperId, dataItems) {
            const wrapper = document.getElementById(wrapperId);
            let originalSlides = "";
            dataItems.forEach((item) => {
                let globalIndex = allImages.length; 
                item.images.forEach(img => allImages.push(img));
                const firstMedia = item.images[0];
                let mediaHtml = isVideo(firstMedia) ? 
                    `<video src="${firstMedia}" class="slide-media" muted playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>` : 
                    `<img src="${firstMedia}" class="slide-media">`;

                originalSlides += `
                    <div class="slide-item" onclick="openLightbox(${globalIndex})">
                        ${mediaHtml}
                        <div class="caption">
                            ${item.title}<br>
                            <span style="font-size:0.7em; color:#666;">[${item.images.length} items]</span>
                        </div>
                    </div>`;
            });
            wrapper.innerHTML = originalSlides;
            setTimeout(() => setupInfiniteLoop(wrapper), 100);
        }

        function setupInfiniteLoop(wrapper) {
            const items = Array.from(wrapper.children);
            if(items.length < 2) return; 
            const firstClone = items[0].cloneNode(true);
            const lastClone = items[items.length - 1].cloneNode(true);
            wrapper.appendChild(firstClone); 
            wrapper.insertBefore(lastClone, items[0]); 
            const itemWidth = items[0].offsetWidth + 20; 
            wrapper.scrollLeft = itemWidth;

            wrapper.addEventListener('scroll', () => {
                const scrollLeft = wrapper.scrollLeft;
                const scrollWidth = wrapper.scrollWidth;
                const clientWidth = wrapper.clientWidth;
                if (scrollLeft >= scrollWidth - clientWidth - 5) wrapper.scrollLeft = itemWidth; 
                if (scrollLeft <= 0) wrapper.scrollLeft = scrollWidth - (2 * clientWidth) + 10; 
            });
        }

        function manualScroll(wrapperId, direction) {
            const wrapper = document.getElementById(wrapperId);
            const itemWidth = wrapper.querySelector('.slide-item').offsetWidth + 20;
            wrapper.scrollBy({ left: direction * itemWidth, behavior: 'smooth' });
        }

        renderSlider('project-slider', siteContent.projects);
        renderSlider('auto-slider', siteContent.automation.items);

        // --- STABIL LIGHTBOX MOTORU ---
        let currentIndex = 0;
        const lb = document.getElementById('lightbox');
        const lbStage = document.getElementById('lb-stage');
        const lbCounter = document.getElementById('lb-counter');

        // Transform Değişkenleri
        let state = {
            scale: 1,
            x: 0,
            y: 0,
            rotate: false,
            imgWidth: 0,
            imgHeight: 0
        };

        // Dokunmatik Değişkenleri
        let startX = 0, startY = 0;
        let lastX = 0, lastY = 0;
        let pinchStartDist = 0;
        let pinchStartScale = 1;
        let isDragging = false;
        let isPinching = false;

        function openLightbox(index) {
            currentIndex = index;
            updateLb();
            lb.style.display = 'block'; 
            document.body.style.overflow = 'hidden'; 
            resetState();
            document.addEventListener('keydown', handleKey);
            window.addEventListener('resize', resetState); // Ekran dönünce sıfırla
        }

        function closeLightbox() {
            lb.style.display = 'none';
            document.body.style.overflow = ''; 
            lbStage.innerHTML = "";
            document.removeEventListener('keydown', handleKey);
            window.removeEventListener('resize', resetState);
        }

        function changeSlide(step) {
            currentIndex += step;
            if (currentIndex >= allImages.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = allImages.length - 1;
            updateLb();
            resetState();
        }

        function updateLb() {
            const currentUrl = allImages[currentIndex];
            let newContent = isVideo(currentUrl) ? 
                `<video src="${currentUrl}" class="lb-main-media" autoplay loop muted playsinline></video>` : 
                `<img src="${currentUrl}" class="lb-main-media" draggable="false">`; 
            
            lbStage.innerHTML = newContent;
            lbCounter.innerText = `${currentIndex + 1} / ${allImages.length}`;

            // Görsel yüklendikten sonra boyutları al ve ortala
            const media = lbStage.querySelector('.lb-main-media');
            media.onload = () => { centerImage(); };
            media.onloadedmetadata = () => { centerImage(); }; // Video için
        }

        function resetState() {
            state.scale = 1;
            state.rotate = false;
            centerImage();
        }

        function toggleRotation() {
            state.rotate = !state.rotate;
            state.scale = 1; 
            centerImage();
        }

        function centerImage() {
            const media = lbStage.querySelector('.lb-main-media');
            if(!media) return;

            // Sahne boyutları
            const stageW = lbStage.clientWidth;
            const stageH = lbStage.clientHeight;

            // Görsel doğal boyutları (veya video)
            let natW = media.naturalWidth || media.videoWidth || stageW;
            let natH = media.naturalHeight || media.videoHeight || stageH;
            
            // Sığdırma oranı
            let ratio = Math.min(stageW / natW, stageH / natH);
            
            // Eğer dönmüşse width/height yer değiştirir
            if (state.rotate) {
                ratio = Math.min(stageW / natH, stageH / natW);
            }

            state.imgWidth = natW * ratio;
            state.imgHeight = natH * ratio;

            // Merkeze yerleştir
            state.x = (stageW - state.imgWidth) / 2;
            state.y = (stageH - state.imgHeight) / 2;
            
            // Rotasyon varsa merkezi düzelt
            if (state.rotate) {
               state.x = (stageW - state.imgHeight) / 2; // Genişlik artık yüksekliktir
               state.y = (stageH - state.imgWidth) / 2;
            }

            updateTransform();
        }

        function updateTransform() {
            const media = lbStage.querySelector('.lb-main-media');
            if(!media) return;

            let transform = `translate3d(${state.x}px, ${state.y}px, 0) scale(${state.scale})`;
            
            if (state.rotate) {
                // Rotasyon merkezi görselin ortasıdır.
                // CSS transform sırası: Translate -> Rotate -> Scale
                // Ancak burada karışıklığı önlemek için sadece görseli döndürüp width/height ile oynuyoruz.
                transform += ` rotate(90deg)`;
            }

            media.style.transform = transform;
            
            // Dönünce taşmaları önlemek için stil ayarı
            if (state.rotate) {
               media.style.width = state.imgHeight + "px"; // Ters
               media.style.height = state.imgWidth + "px";
            } else {
               media.style.width = state.imgWidth + "px";
               media.style.height = state.imgHeight + "px";
            }
        }

        // --- GELİŞMİŞ TOUCH EVENTLERİ ---

        lbStage.addEventListener('touchstart', (e) => {
            if(isVideo(allImages[currentIndex])) return;
            // e.preventDefault(); // Bunu kaldırdık, swipe için gerekli olabilir ama zoomda sorun yaratırsa açarız.

            if (e.touches.length === 2) {
                isPinching = true;
                pinchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                pinchStartScale = state.scale;
            } else if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                lastX = state.x;
                lastY = state.y;
            }
        }, {passive: false});

        lbStage.addEventListener('touchmove', (e) => {
            if(isVideo(allImages[currentIndex])) return;
            e.preventDefault(); // Sayfa kaymasını engelle

            if (isPinching && e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                state.scale = Math.max(1, Math.min(pinchStartScale * (dist / pinchStartDist), 4));
                updateTransform();
            } else if (isDragging && e.touches.length === 1 && state.scale > 1) {
                // SADECE ZOOM VARSA SÜRÜKLE
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;

                state.x = lastX + dx;
                state.y = lastY + dy;
                
                // Rotasyon varsa eksenleri düzelt
                if(state.rotate) {
                     state.x = lastX + dy; 
                     state.y = lastY - dx;
                }
                
                updateTransform();
            }
        }, {passive: false});

        lbStage.addEventListener('touchend', (e) => {
            isDragging = false;
            isPinching = false;
            
            // Eğer zoom < 1 ise geri getir
            if (state.scale < 1) {
                state.scale = 1;
                centerImage();
            }

            // SWIPE MANTIĞI (Zoom 1 ise)
            if (state.scale === 1 && e.changedTouches.length === 1) {
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const diffX = endX - startX;
                const diffY = endY - startY;
                const threshold = 50;

                if (state.rotate) {
                    if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > threshold) {
                        if (diffY < 0) changeSlide(1); else changeSlide(-1);
                    }
                } else {
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
                        if (diffX < 0) changeSlide(1); else changeSlide(-1);
                    }
                }
            }
        });

        // Çift Dokunma (Double Tap) - Stabil Versiyon
        let lastTap = 0;
        lbStage.addEventListener('touchend', (e) => {
            if(isVideo(allImages[currentIndex])) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                // Double Tap Algılandı
                e.preventDefault();
                if (state.scale > 1) {
                    state.scale = 1;
                    centerImage();
                } else {
                    state.scale = 2.5;
                    // Ortadan zoomlamak için basitçe x,y'yi merkeze alıp scale'i artırıyoruz
                    // Tıklanan noktaya zoom yapmak karmaşıklığı artırıp flicker yapabiliyor
                    // O yüzden en stabil yöntem "Merkeze Zoom"dur.
                    updateTransform(); 
                }
            }
            lastTap = currentTime;
        });

        // Masaüstü için Mouse Events (Tut-Sürükle)
        lbStage.addEventListener('mousedown', (e) => {
             if(isVideo(allImages[currentIndex]) || state.scale === 1) return;
             isDragging = true;
             startX = e.clientX; startY = e.clientY;
             lastX = state.x; lastY = state.y;
             e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
             if(!isDragging) return;
             const dx = e.clientX - startX;
             const dy = e.clientY - startY;
             state.x = lastX + dx;
             state.y = lastY + dy;
             updateTransform();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });


        function handleKey(e) {
            if(e.key === 'ArrowRight') changeSlide(1);
            if(e.key === 'ArrowLeft') changeSlide(-1);
            if(e.key === 'Escape') closeLightbox();
        }

    </script>
</body>
</html>
