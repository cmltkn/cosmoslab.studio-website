<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UTM Link Generator</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #111; color: #eee; max-width: 640px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 1.4rem; letter-spacing: 1px; text-transform: uppercase; }
  label { display: block; margin-top: 20px; font-size: 0.9rem; color: #aaa; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem; background: #1c1c1c; color: #fff; border: 1px solid #333; border-radius: 4px; margin-top: 6px; }
  .result { margin-top: 24px; padding: 16px; background: #1c1c1c; border: 1px solid #333; border-radius: 4px; word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: 0.95rem; color: #8fd; min-height: 1.3em; }
  button { margin-top: 12px; padding: 10px 16px; background: #2a6; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #3b7; }
  .copied { color: #8fd; margin-left: 10px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; }
  .copied.show { opacity: 1; }
</style>
</head>
<body>
  <h1>UTM Link Generator</h1>

  <label for="company">Company name</label>
  <input id="company" type="text" placeholder="e.g. acme" autocomplete="off" autofocus>

  <label>Generated URL</label>
  <div id="result" class="result"></div>

  <button id="copyBtn" type="button">Copy</button>
  <span id="copied" class="copied">Copied!</span>

<script>
  const BASE = 'https://cosmoslab.studio';
  const input = document.getElementById('company');
  const result = document.getElementById('result');
  const copyBtn = document.getElementById('copyBtn');
  const copiedMsg = document.getElementById('copied');

  function build() {
    const raw = input.value.trim().toLowerCase();
    const company = encodeURIComponent(raw);
    if (!raw) { result.textContent = ''; return; }
    result.textContent = `${BASE}?utm_source=${company}&utm_medium=email&utm_campaign=application`;
  }

  input.addEventListener('input', build);

  copyBtn.addEventListener('click', () => {
    if (!result.textContent) return;
    navigator.clipboard.writeText(result.textContent).then(() => {
      copiedMsg.classList.add('show');
      setTimeout(() => copiedMsg.classList.remove('show'), 1200);
    });
  });
</script>
</body>
</html>
