<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmos.Lab Studio</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <style>
        /* --- 1. TEMEL AYARLAR (ESKİ DOSYADAN BİREBİR) --- */
        body { 
            background-color: #0e0e0e; 
            color: #f0f0f0; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            overflow-x: hidden; 
            touch-action: auto; 
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 2. LOADER STYLES (ESKİ DOSYADAN BİREBİR) --- */
        #loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; 
            z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease-in-out; 
        }
        
        canvas#particle-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        #loader-slogan {
            position: absolute;
            top: calc(50% + 80px); 
            transform: translateY(-50%);
            font-size: 1.1rem; 
            letter-spacing: 8px; 
            color: #cccccc; 
            opacity: 0; 
            transition: opacity 0.8s ease-out;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        
        .loaded #loader-container { opacity: 0; pointer-events: none; }
        .slogan-visible #loader-slogan { opacity: 1; }

        /* --- 3. HEADER & SITE STYLES (ESKİ GENİŞLİKLER) --- */
        header { 
            padding: 2rem 3rem; /* Eski 3rem ayarı */
            width: 100%; 
            box-sizing: border-box;
            position: sticky; top: 0; 
            background: rgba(14, 14, 14, 0.95); 
            z-index: 100; 
            display: flex; justify-content: space-between; 
            border-bottom: 1px solid #333; 
            align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -2px; }
        
        .header-right { display: flex; align-items: center; gap: 30px; }
        
        nav { display: flex; gap: 20px; }
        nav a { color: #888; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: #fff; }

        /* DİL BUTONLARI (Yeni Eklenen Tek Şey) */
        .lang-switch {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.8rem; font-weight: bold;
            border-left: 1px solid #444; padding-left: 20px;
        }
        .lang-btn { color: #555; cursor: pointer; transition: 0.3s; padding: 2px; }
        .lang-btn:hover { color: #fff; }
        .lang-btn.active { color: #fff; text-decoration: underline; }

        section { 
            padding: 2rem 0; 
            max-width: 70%; /* Eski %70 ayarı */
            margin: 0 auto; 
            scroll-margin-top: 100px; 
        }
        
        h2 { font-size: 1.8rem; margin-bottom: 1rem; border-left: 4px solid #fff; padding-left: 15px; text-transform: uppercase; }
        
        p { 
            color: #bfbfbf; font-weight: 600; max-width: 100%; 
            line-height: 1.6; margin-bottom: 1.5rem; 
        }
        p b, p strong { color: #ffffff; font-weight: 900; letter-spacing: 1px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-bottom: 30px; }

        /* --- TEAM SECTION (MOBİL DÜZENİ İÇİN GRID) --- */
        .team-desc {
            font-size: 0.85rem; color: #888; font-style: italic;
            margin-top: 25px; margin-bottom: 25px; border-left: 2px solid #333;
            padding-left: 15px; max-width: 90%;
        }
        .team-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; /* Yan yana olması için */
        }
        .partner-card {
            border: 1px solid #333; padding: 15px 20px; cursor: pointer;
            transition: all 0.3s ease; background: #0a0a0a; 
            display: flex; flex-direction: column; gap: 5px; justify-content: space-between;
        }
        .partner-card:hover { border-color: #fff; background: #111; transform: translateY(-2px); }
        .partner-name { color: #fff; font-weight: 700; font-size: 0.95rem; letter-spacing: 1px; }
        .partner-role { color: #666; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card-action {
            margin-top: 15px; padding-top: 10px; border-top: 1px dashed #333; 
            font-size: 0.7rem; color: #555; display: flex; justify-content: space-between; 
            align-items: center; transition: all 0.3s ease;
        }
        .partner-card:hover .card-action { color: #fff; border-top-color: #666; }
        .action-arrow { transition: transform 0.3s ease; }
        .partner-card:hover .action-arrow { transform: translateX(5px); }

        /* --- SLIDER (ESKİ DOSYADAN BİREBİR) --- */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .slider-wrapper { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide-item { 
            min-width: 700px; display: flex; flex-direction: column;
            position: relative; cursor: pointer; border: 1px solid #333; background: #000;
            transition: border-color 0.3s; flex-shrink: 0; 
            scroll-snap-align: start; scroll-snap-stop: always;
        }
        .slide-item:hover { border-color: #fff; }
        
        .slide-media { width: 100%; height: 500px; object-fit: contain; display: block; background-color: #000; pointer-events: none; }
        
        .caption { 
            width: 100%; background: #121212; padding: 18px 22px; 
            box-sizing: border-box; border-top: 1px solid #222;
            display: flex; flex-direction: column; gap: 6px; text-align: left;
        }
        .caption div:first-child { 
            color: #cccccc; font-size: 0.95rem; font-weight: 600; 
            letter-spacing: 1px; line-height: 1.4; text-transform: uppercase;
            white-space: normal; word-wrap: break-word; overflow-wrap: break-word;
        }
        .caption span { 
            font-size: 0.75rem !important; color: #555 !important;
            font-weight: normal; letter-spacing: 0.5px; font-family: sans-serif; 
        }
        .slide-item:hover .caption div:first-child { color: #fff; }
        .slide-item:hover .caption { border-top-color: #444; background: #161616; }

        .slider-btn { 
            position: absolute; top: 250px; transform: translateY(-50%); 
            background: rgba(0,0,0,0.9); color: #fff; border: 1px solid #555; 
            width: 50px; height: 50px; cursor: pointer; z-index: 50; 
            font-size: 24px; display: flex; align-items: center; justify-content: center;
        }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        /* --- LIGHTBOX (ESKİ PRO VERSION) --- */
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        .lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
        .lb-main-media { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; user-select: none; -webkit-user-drag: none; will-change: transform; }
        video.lb-main-media { z-index: 10; pointer-events: none; }
        .lb-ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 50px; cursor: pointer; padding: 20px; pointer-events: auto; text-shadow: 0 0 10px #000; background: rgba(0,0,0,0.2); border-radius: 5px; transition: all 0.3s ease; }
        .lb-prev-arrow { left: 10px; } .lb-next-arrow { right: 10px; }
        .close-lb { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 40px; cursor: pointer; pointer-events: auto; text-shadow: 0 0 10px #000; z-index: 30; }
        .rotate-btn { display: none; position: absolute; top: 25px; right: 80px; color: #fff; font-size: 30px; cursor: pointer; pointer-events: auto; border: 1px solid #fff; border-radius: 50%; width: 40px; height: 40px; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 30; transition: all 0.3s ease; }
        .rotate-btn.active { background: #fff; color: #000; transform: rotate(90deg); }
        .lb-counter { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #cccccc; font-size: 0.9rem; letter-spacing: 2px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
        .rotate-mode .lb-prev-arrow { top: 10px; left: 50%; transform: translateX(-50%) rotate(90deg); }
        .rotate-mode .lb-next-arrow { top: auto; bottom: 10px; left: 50%; transform: translateX(-50%) rotate(90deg); }

        /* --- MOBİL UYUMLULUK (DÜZELTİLDİ) --- */
        @media (max-width: 900px) {
            
            /* 1. Header ve Dil Kutusu Ayarı (İstediğin Gibi) */
            header { 
                padding: 1.5rem 1rem; 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 20px; 
                position: sticky; 
            }

            .lang-switch {
                position: absolute; /* Dil kutusunu sağ üste çivile */
                top: 2rem;          
                right: 1rem;        
                border-left: none;  
                padding-left: 0;
            }

            .header-right { 
                width: 100%; 
                justify-content: flex-start; 
                margin-top: 5px; 
            }
            
            nav { gap: 15px 20px; flex-wrap: wrap; }

            /* 2. ANA DÜZELTME: Who We Are Kısmı Alt Alta (Eski Hali) */
            .info-grid { 
                grid-template-columns: 1fr; /* Tek kolon olsun (Alt alta) */
                gap: 40px; 
            }

            /* 3. Diğer Mobil Ayarlar */
            section { max-width: 90%; } 
            
            .slide-item { min-width: 90vw; width: 90vw; margin-right: 15px; } 
            .slide-media { height: 300px; }
            
            .slider-btn { display: none; }
            .rotate-btn { display: flex; }
            .lb-arrow { font-size: 30px; padding: 15px; }
            
            /* Team Grid Mobilde de Yan Yana Kalsın (İstersen burayı da 1fr yapabilirsin) */
            .team-grid { gap: 15px; } 
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <canvas id="particle-canvas"></canvas>
        <div id="loader-slogan">FROM CHAOS TO COSMOS</div>
    </div>

    <header>
        <div class="logo" id="logo">COSMOS.LAB STUDIO</div>
        <div class="header-right">
            <nav id="menu"></nav>
            <div class="lang-switch">
                <span onclick="setLanguage('en')" class="lang-btn" id="btn-en">EN</span>
                <span style="color:#333">/</span>
                <span onclick="setLanguage('tr')" class="lang-btn" id="btn-tr">TR</span>
            </div>
        </div>
    </header>

    <section id="about-section">
        <div class="info-grid">
            <div>
                <h2 id="who-title"></h2>
                <p id="who-text"></p>
                <div class="team-desc" id="team-desc-text"></div>
                <div class="team-grid" id="team-container"></div>
            </div>
            <div>
                <h2 id="what-title"></h2>
                <p id="what-text"></p>
            </div>
        </div>
    </section>

    <section id="projects-section">
        <h2 id="projects-title">SELECTED PROJECTS</h2>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('project-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="project-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('project-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="automation-section">
        <h2 id="auto-title"></h2>
        <p id="auto-desc"></p>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('auto-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="auto-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('auto-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="contact-section" style="border-top: 1px solid #333; margin-top: 30px;">
        <h2>CONTACT</h2>
        <p id="contact-info"></p>
    </section>

    <div class="lightbox" id="lightbox">
        <div class="lb-stage" id="lb-stage"></div>
        <div class="lb-ui-layer" id="lb-ui">
            <span class="close-lb" onclick="closeLightbox()">&times;</span>
            <div class="rotate-btn" id="rotate-btn" onclick="toggleRotationMode()">&#8635;</div>
            <div class="lb-arrow lb-prev-arrow" onclick="changeSlide(-1)">&#10094;</div>
            <div class="lb-arrow lb-next-arrow" onclick="changeSlide(1)">&#10095;</div>
            <div class="lb-counter" id="lb-counter"></div>
        </div>
    </div>

    <script src="content.js"></script>
    <script>
        // --- 1. DİL ve İÇERİK YÖNETİMİ ---
        let currentLang = 'en';
        try { currentLang = localStorage.getItem('siteLang') || 'en'; } catch(e) {}

        function setLanguage(lang) {
            if(typeof siteContent === 'undefined' || !siteContent[lang]) return;
            currentLang = lang;
            try { localStorage.setItem('siteLang', lang); } catch(e) {}
            renderPage();
        }

        function renderPage() {
            if (typeof siteContent === 'undefined') return;
            const data = siteContent[currentLang];
            if (!data) return;

            // UI Güncellemeleri
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + currentLang);
            if(activeBtn) activeBtn.classList.add('active');

            if(data.header) {
                document.getElementById('logo').innerText = data.header.title || "COSMOS.LAB STUDIO";
                const nav = document.getElementById('menu');
                nav.innerHTML = "";
                if(data.header.menu) {
                    data.header.menu.forEach(item => {
                        nav.innerHTML += `<a href="${item.link}">${item.text}</a>`;
                    });
                }
            }

            if(data.about) {
                document.getElementById('who-title').innerText = data.about.whoWeAreTitle || "";
                document.getElementById('who-text').innerHTML = data.about.whoWeAreText || "";
                document.getElementById('what-title').innerText = data.about.whatWeDoTitle || "";
                document.getElementById('what-text').innerHTML = data.about.whatWeDoText || "";
                
                if(data.about.teamDescription) {
                     const tDesc = document.getElementById('team-desc-text');
                     tDesc.innerText = data.about.teamDescription;
                     tDesc.style.display = 'block';
                }
            }

            if(data.automation) {
                document.getElementById('auto-title').innerText = data.automation.title || "";
                document.getElementById('auto-desc').innerHTML = data.automation.description || "";
            }
            
            if(data.contact) {
                document.getElementById('contact-info').innerHTML = `
                    ${data.contact.email}<br>
                    ${data.contact.phone}<br>
                    ${data.contact.location}
                `;
            }
            
            if(data.ui && data.ui.selectedProjects) {
                document.getElementById('projects-title').innerText = data.ui.selectedProjects;
            }

            renderSlider('project-slider', data.projects || []);
            renderSlider('auto-slider', data.automation ? data.automation.items : []);
            renderTeam('team-container', data.team || [], data.ui);
        }

        // --- 2. RENDER YARDIMCILARI (Eski Tasarım Korundu) ---
        let allImages = []; 
        function isVideo(url) { return url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.webm'); }
        
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const video = entry.target;
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => { video.muted = true; video.play(); });
                    }
                } else { entry.target.pause(); }
            });
        }, { threshold: 0.1 });

        function renderSlider(wrapperId, dataItems) {
            const wrapper = document.getElementById(wrapperId);
            if(!wrapper) return;
            wrapper.innerHTML = ""; 
            
            let originalSlides = "";
            dataItems.forEach((item) => {
                let globalIndex = allImages.length; 
                item.images.forEach(img => allImages.push(img));
                const firstMedia = item.images[0];
                let mediaHtml = isVideo(firstMedia) ? 
                    `<video src="${firstMedia}" class="slide-media" autoplay loop muted playsinline></video>` : 
                    `<img src="${firstMedia}" class="slide-media">`;

                originalSlides += `
                    <div class="slide-item" onclick="openLightbox(${globalIndex})">
                        ${mediaHtml}
                        <div class="caption">
                            <div>${item.title}</div>
                            <span>[${item.images.length} items]</span>
                        </div>
                    </div>`;
            });
            wrapper.innerHTML = originalSlides;
            const originalVideos = wrapper.querySelectorAll('video');
            originalVideos.forEach(v => videoObserver.observe(v));
            setTimeout(() => setupInfiniteLoop(wrapper), 100);
        }

        function renderTeam(containerId, teamData, uiLabels) {
            const container = document.getElementById(containerId);
            if (!teamData || teamData.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'grid'; // Yan yana olması için Grid

            const roleText = uiLabels ? uiLabels.managingPartner : "MANAGING PARTNER";
            const viewText = uiLabels ? uiLabels.viewProfile : "VIEW PROFILE";

            let html = "";
            teamData.forEach(member => {
                let globalIndex = allImages.length;
                if(member.images.length > 0) { member.images.forEach(img => allImages.push(img)); }

               html += `
                <div class="partner-card" onclick="openLightbox(${globalIndex})">
                    <div>
                        <div class="partner-name">${member.title}</div>
                        <div class="partner-role">${roleText}</div>
                    </div>
                    <div class="card-action">
                        <span>${viewText}</span>
                        <span class="action-arrow">&#10142;</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function setupInfiniteLoop(wrapper) {
            const items = Array.from(wrapper.children);
            if(items.length < 2) return; 
            const firstClone = items[0].cloneNode(true);
            const lastClone = items[items.length - 1].cloneNode(true);
            
            if(firstClone.querySelector('video')) { let v = firstClone.querySelector('video'); v.muted = true; videoObserver.observe(v); }
            if(lastClone.querySelector('video')) { let v = lastClone.querySelector('video'); v.muted = true; videoObserver.observe(v); }

            wrapper.appendChild(firstClone); 
            wrapper.insertBefore(lastClone, items[0]); 
            const itemWidth = items[0].offsetWidth + 20; 
            wrapper.scrollLeft = itemWidth;
            wrapper.addEventListener('scroll', () => {
                const scrollLeft = wrapper.scrollLeft; const scrollWidth = wrapper.scrollWidth; const clientWidth = wrapper.clientWidth;
                if (scrollLeft >= scrollWidth - clientWidth - 5) wrapper.scrollLeft = itemWidth; 
                if (scrollLeft <= 0) wrapper.scrollLeft = scrollWidth - (2 * clientWidth) + 10; 
            });
        }

        function manualScroll(wrapperId, direction) {
            const wrapper = document.getElementById(wrapperId);
            const itemWidth = wrapper.querySelector('.slide-item').offsetWidth + 20;
            wrapper.scrollBy({ left: direction * itemWidth, behavior: 'smooth' });
        }

        // --- 3. ESKİ PARTICLE LOADER (BİREBİR KOPYALANDI) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let particlesArray = [];
        let loadProgress = 0.0;
        let targetProgress = 0.0;
        let mainText = "COSMOS.LAB STUDIO"; // İsim düzeltildi

        const LOADER_MIN_MS = 2600; const LOADER_MAX_MS = 8000;
        const SLOGAN_AT_PROGRESS = 0.86; const EXIT_AT_PROGRESS = 0.985; const HOLD_AFTER_SLOGAN_MS = 1400;
        const loaderStart = performance.now();
        let exitArmed = false; let exitStarted = false;

        function armExit() {
            if (exitArmed) return;
            exitArmed = true; clearInterval(simulationInterval); targetProgress = 1.0;
        }
        function startExitSequence(force) {
            if (exitStarted) return;
            exitStarted = true;
            document.body.classList.add('slogan-visible');
            setTimeout(() => { document.body.classList.add('loaded'); }, HOLD_AFTER_SLOGAN_MS);
        }

        document.addEventListener('DOMContentLoaded', armExit);
        window.addEventListener('load', () => { targetProgress = 1.0; });
        setTimeout(() => { armExit(); startExitSequence(true); }, LOADER_MAX_MS);

        function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        setCanvasSize();
        const fontSize = Math.min(window.innerWidth / 12, 80); 
        const fontSettings = `900 ${fontSize}px 'Courier New', monospace`;
        ctx.font = fontSettings;
        
        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX; this.targetY = targetY;
                const angle = Math.random() * Math.PI * 2; const radius = Math.random() * (canvas.width * 0.8); 
                const centerX = canvas.width / 2; const centerY = canvas.height / 2;
                this.x = centerX + Math.cos(angle) * radius; this.y = centerY + Math.sin(angle) * radius;
                this.size = Math.random() * 1.5 + 0.5; this.baseOpacity = Math.random() * 0.6 + 0.4; 
            }
            draw() {
                let currentOpacity = this.baseOpacity + (loadProgress * (1 - this.baseOpacity));
                if(loadProgress > 0.95) currentOpacity = 1.0;
                ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
                ctx.beginPath(); ctx.rect(this.x, this.y, this.size, this.size); ctx.closePath(); ctx.fill();
            }
            update() {
                let dx = this.targetX - this.x; let dy = this.targetY - this.y;
                let speed = 0.04 + (loadProgress * 0.1);
                if(Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3 && loadProgress > 0.9) { this.x = this.targetX; this.y = this.targetY; } 
                else { this.x += dx * speed; this.y += dy * speed; }
            }
        }

        function initParticles() {
            particlesArray = [];
            const textWidth = ctx.measureText(mainText).width;
            const startX = (canvas.width - textWidth) / 2; const startY = canvas.height / 2;
            ctx.fillStyle = 'white'; ctx.fillText(mainText, startX, startY);
            const scanHeight = fontSize * 2; const scanY = startY - fontSize; 
            const textCoordinates = ctx.getImageData(startX, scanY, textWidth, scanHeight);
            const step = 2; 
            for (let y = 0; y < textCoordinates.height; y += step) {
                for (let x = 0; x < textCoordinates.width; x += step) {
                    const alpha = textCoordinates.data[(y * 4 * textCoordinates.width) + (x * 4) + 3];
                    if (alpha > 128) { if(Math.random() > 0.3) { particlesArray.push(new Particle(x + startX, y + scanY)); } }
                }
            }
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (loadProgress < targetProgress) loadProgress += 0.005;
            if (!exitStarted) {
                const elapsed = performance.now() - loaderStart;
                if (loadProgress >= SLOGAN_AT_PROGRESS) { document.body.classList.add('slogan-visible'); }
                if (exitArmed && elapsed >= LOADER_MIN_MS && loadProgress >= EXIT_AT_PROGRESS) { startExitSequence(false); }
            }
            if(loadProgress > 0.5) {
                let textOpacity = (loadProgress - 0.5) * 2; if(textOpacity > 1) textOpacity = 1;
                ctx.save(); ctx.globalAlpha = textOpacity; ctx.fillStyle = '#FFFFFF';
                const textWidth = ctx.measureText(mainText).width;
                const startX = (canvas.width - textWidth) / 2; const startY = canvas.height / 2;
                ctx.fillText(mainText, startX, startY); ctx.restore();
            }
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            if (!document.body.classList.contains('loaded')) { requestAnimationFrame(animateParticles); }
        }
        initParticles(); animateParticles();
        let simulationInterval = setInterval(() => { if(targetProgress < 0.6) targetProgress += 0.01; }, 50);
        window.addEventListener('resize', () => {
            setCanvasSize(); const newFontSize = Math.min(window.innerWidth / 12, 80); 
            ctx.font = `900 ${newFontSize}px 'Courier New', monospace`; initParticles();
        });

        // --- 4. ESKİ PRO LIGHTBOX (BİREBİR KOPYALANDI) ---
        let currentIndex = 0;
        const lb = document.getElementById('lightbox');
        const lbStage = document.getElementById('lb-stage');
        const lbCounter = document.getElementById('lb-counter');
        const lbUi = document.getElementById('lb-ui');
        const rotateBtn = document.getElementById('rotate-btn');
        let state = { scale: 1, x: 0, y: 0, rotate: false };

        function openLightbox(index) { currentIndex = index; renderLightboxContent(); lb.style.display = 'block'; document.body.style.overflow = 'hidden'; resetState(); document.addEventListener('keydown', handleKey); }
        function closeLightbox() { lb.style.display = 'none'; document.body.style.overflow = ''; lbStage.innerHTML = ""; document.removeEventListener('keydown', handleKey); }
        function changeSlide(step) { currentIndex += step; if (currentIndex >= allImages.length) currentIndex = 0; if (currentIndex < 0) currentIndex = allImages.length - 1; renderLightboxContent(); state.scale = 1; state.x = 0; state.y = 0; applyTransform(); }
        function renderLightboxContent() {
            const currentUrl = allImages[currentIndex]; let contentHTML = "";
            if (isVideo(currentUrl)) { contentHTML = `<video src="${currentUrl}" class="lb-main-media" autoplay loop muted playsinline></video>`; } 
            else { contentHTML = `<img src="${currentUrl}" class="lb-main-media" draggable="false">`; }
            lbStage.innerHTML = contentHTML; lbCounter.innerText = `${currentIndex + 1} / ${allImages.length}`;
            const media = lbStage.querySelector('.lb-main-media'); if(media) { media.onload = applyTransform; if(isVideo(currentUrl)) applyTransform(); }
        }
        function resetState() { state.scale = 1; state.x = 0; state.y = 0; applyTransform(); }
        function toggleRotationMode() { state.rotate = !state.rotate; if (state.rotate) { rotateBtn.classList.add('active'); lbUi.classList.add('rotate-mode'); } else { rotateBtn.classList.remove('active'); lbUi.classList.remove('rotate-mode'); } state.scale = 1; state.x = 0; state.y = 0; applyTransform(); }
        function applyTransform() {
            const media = lbStage.querySelector('.lb-main-media'); if(!media) return;
            let transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
            if (state.rotate) { transform += ` rotate(90deg)`; media.style.width = "100vh"; media.style.height = "100vw"; media.style.maxWidth = "none"; media.style.maxHeight = "none"; } 
            else { media.style.width = ""; media.style.height = ""; media.style.maxWidth = "100%"; media.style.maxHeight = "100%"; }
            media.style.transform = transform;
        }
        function clampPosition() {
            const media = lbStage.querySelector('.lb-main-media'); if (!media) return;
            let currentW = media.offsetWidth * state.scale; let currentH = media.offsetHeight * state.scale;
            if (state.rotate) { let temp = currentW; currentW = currentH; currentH = temp; }
            const screenW = window.innerWidth; const screenH = window.innerHeight;
            const maxX = Math.max(0, (currentW - screenW) / 2); const maxY = Math.max(0, (currentH - screenH) / 2);
            state.x = Math.max(-maxX, Math.min(state.x, maxX)); state.y = Math.max(-maxY, Math.min(state.y, maxY));
        }

        let startX = 0, startY = 0, lastX = 0, lastY = 0, pinchStartDist = 0, pinchStartScale = 1, isDragging = false, isPinching = false;
        lbStage.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) { if(isVideo(allImages[currentIndex])) return; isPinching = true; pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); pinchStartScale = state.scale; } 
            else if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; lastX = state.x; lastY = state.y; }
        }, {passive: false});
        lbStage.addEventListener('touchmove', (e) => {
            if(e.cancelable) e.preventDefault(); 
            if (isPinching && e.touches.length === 2) { if(isVideo(allImages[currentIndex])) return; const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); state.scale = Math.max(1, Math.min(pinchStartScale * (dist / pinchStartDist), 4)); clampPosition(); applyTransform(); } 
            else if (isDragging && e.touches.length === 1 && state.scale > 1) { const dx = e.touches[0].clientX - startX; const dy = e.touches[0].clientY - startY; state.x = lastX + dx; state.y = lastY + dy; clampPosition(); applyTransform(); }
        }, {passive: false});
        lbStage.addEventListener('touchend', (e) => {
            isDragging = false; isPinching = false; if (state.scale < 1) { state.scale = 1; state.x = 0; state.y = 0; applyTransform(); }
            if (state.scale <= 1.05 && e.changedTouches.length === 1) { const endX = e.changedTouches[0].clientX; const endY = e.changedTouches[0].clientY; const diffX = endX - startX; const diffY = endY - startY; const threshold = 40; if (state.rotate) { if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > threshold) { if (diffY < 0) changeSlide(1); else changeSlide(-1); } } else { if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) { if (diffX < 0) changeSlide(1); else changeSlide(-1); } } }
        });
        let lastTap = 0;
        const handleDoubleTap = (e) => {
            if(isVideo(allImages[currentIndex])) return; if (Math.abs(e.changedTouches[0].clientX - startX) > 10) return;
            const currentTime = new Date().getTime(); const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) { e.preventDefault(); if (state.scale > 1) { state.scale = 1; state.x = 0; state.y = 0; } else { state.scale = 2.5; } applyTransform(); } lastTap = currentTime;
        };
        lbStage.addEventListener('touchend', handleDoubleTap);
        lbStage.addEventListener('mousedown', (e) => { if(isVideo(allImages[currentIndex]) || state.scale === 1) return; isDragging = true; startX = e.clientX; startY = e.clientY; lastX = state.x; lastY = state.y; e.preventDefault(); });
        window.addEventListener('mousemove', (e) => { if(!isDragging) return; const dx = e.clientX - startX; const dy = e.clientY - startY; state.x = lastX + dx; state.y = lastY + dy; clampPosition(); applyTransform(); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        lbStage.addEventListener('dblclick', (e) => { if(isVideo(allImages[currentIndex])) return; if (state.scale > 1) { state.scale = 1; state.x = 0; state.y = 0; } else { state.scale = 2.5; } applyTransform(); });
        function handleKey(e) { if(e.key === 'ArrowRight') changeSlide(1); if(e.key === 'ArrowLeft') changeSlide(-1); if(e.key === 'Escape') closeLightbox(); }

        // SAYFA YÜKLENDİĞİNDE
        renderPage();

    </script>
</body>
</html>
