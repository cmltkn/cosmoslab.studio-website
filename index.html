<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMOS.LAB STUDIO</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <style>
        /* --- TEMEL AYARLAR (Orijinal) --- */
        body { 
            background-color: #0e0e0e; 
            color: #f0f0f0; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            overflow-x: hidden; 
            touch-action: auto; 
            -webkit-tap-highlight-color: transparent;
        }

        /* --- LOADER CONTAINER (Hybrid Scenario) --- */
        #loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; 
            z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease-in-out; 
        }
        
        canvas#particle-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Alt slogan */
        #loader-slogan {
            position: absolute;
            top: calc(50% + 80px); 
            transform: translateY(-50%);
            font-size: 1.1rem; 
            letter-spacing: 8px; 
            color: #aaa; 
            opacity: 0; 
            transition: opacity 0.8s ease-out;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        
        .loaded #loader-container { opacity: 0; pointer-events: none; }
        .slogan-visible #loader-slogan { opacity: 1; }

        /* --- HEADER & SITE STYLES (Orijinal) --- */
        header { 
            padding: 2rem 3rem; width: 100%; box-sizing: border-box;
            position: sticky; top: 0; background: rgba(14, 14, 14, 0.95); z-index: 100; 
            display: flex; justify-content: space-between; border-bottom: 1px solid #333; 
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -2px; }
        nav a { color: #888; text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: #fff; }

        section { padding: 2rem 0; max-width: 70%; margin: 0 auto; scroll-margin-top: 100px; }
        h2 { font-size: 1.8rem; margin-bottom: 1rem; border-left: 4px solid #fff; padding-left: 15px; text-transform: uppercase; }
        p { color: #aaa; max-width: 800px; line-height: 1.6; margin-bottom: 1.5rem; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-bottom: 30px; }

        /* --- SLIDER --- */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .slider-wrapper { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide-item { 
            min-width: 700px; display: flex; flex-direction: column;
            position: relative; cursor: pointer; border: 1px solid #333; background: #000;
            transition: border-color 0.3s; flex-shrink: 0; 
            scroll-snap-align: start; scroll-snap-stop: always;
        }
        .slide-item:hover { border-color: #fff; }
        
        .slide-media { width: 100%; height: 500px; object-fit: contain; display: block; background-color: #000; pointer-events: none; }
        
        /* KART TASARIMI */
        .caption { 
            width: 100%; background: #121212; padding: 18px 22px; 
            box-sizing: border-box; border-top: 1px solid #222;
            display: flex; flex-direction: column; gap: 6px; text-align: left;
        }
        .caption div:first-child { 
            color: #e0e0e0; font-size: 0.95rem; font-weight: 600; 
            letter-spacing: 1px; line-height: 1.4; text-transform: uppercase;
        }
        .caption span { 
            font-size: 0.75rem !important; color: #555 !important;
            font-weight: normal; letter-spacing: 0.5px; font-family: sans-serif; 
        }

        .slider-btn { 
            position: absolute; top: 250px; transform: translateY(-50%); 
            background: rgba(0,0,0,0.9); color: #fff; border: 1px solid #555; 
            width: 50px; height: 50px; cursor: pointer; z-index: 50; 
            font-size: 24px; display: flex; align-items: center; justify-content: center;
        }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        /* --- LIGHTBOX (Orijinal) --- */
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        .lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
        .lb-main-media { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) { 
            header { padding: 1.5rem 1rem; flex-direction: column; align-items: flex-start; gap: 15px; }
            nav { display: flex; flex-wrap: wrap; width: 100%; justify-content: flex-start; gap: 15px 20px; }
            nav a { margin-left: 0; font-size: 0.8rem; }
            section { max-width: 90%; } 
            .info-grid { grid-template-columns: 1fr; gap: 30px; }
            .slide-item { min-width: 90vw; width: 90vw; } 
            .slide-media { height: 300px; }
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <canvas id="particle-canvas"></canvas>
        <div id="loader-slogan">FROM CHAOS TO COSMOS</div>
    </div>

    <header>
        <div class="logo" id="logo"></div>
        <nav id="menu"></nav>
    </header>

    <section id="about-section">
        <div class="info-grid">
            <div>
                <h2 id="who-title"></h2>
                <p id="who-text"></p>
            </div>
            <div>
                <h2 id="what-title"></h2>
                <p id="what-text"></p>
            </div>
        </div>
    </section>

    <section id="projects-section">
        <h2>SELECTED PROJECTS</h2>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('project-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="project-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('project-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="automation-section">
        <h2 id="auto-title"></h2>
        <p id="auto-desc"></p>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('auto-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="auto-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('auto-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="contact-section" style="border-top: 1px solid #333; margin-top: 30px;">
        <h2>CONTACT</h2>
        <p id="contact-info"></p>
    </section>

    <div class="lightbox" id="lightbox">
        <div class="lb-stage" id="lb-stage"></div>
        <div class="lb-ui-layer" id="lb-ui">
            <span class="close-lb" onclick="closeLightbox()" style="position: absolute; top: 20px; right: 20px; color: #fff; font-size: 40px; cursor: pointer; z-index: 30;">&times;</span>
            <div class="lb-arrow lb-prev-arrow" onclick="changeSlide(-1)" style="left: 10px; position: absolute; top: 50%; color: #fff; font-size: 50px; cursor: pointer; pointer-events: auto;">&#10094;</div>
            <div class="lb-arrow lb-next-arrow" onclick="changeSlide(1)" style="right: 10px; position: absolute; top: 50%; color: #fff; font-size: 50px; cursor: pointer; pointer-events: auto;">&#10095;</div>
            <div class="lb-counter" id="lb-counter" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #aaa;"></div>
        </div>
    </div>

    <script src="content.js"></script>
    <script>
        // --- LOADER ZAMANLAYICI (YENİ EK) ---
        let loadFinished = false;
        const FORCED_LIMIT = 4000; // Videolar inmese de 4 saniye sonra süreci başlat

        function startExitSequence() {
            if (loadFinished) return;
            loadFinished = true;
            targetProgress = 1.0; // Partikülleri topla
            
            // Orijinal estetik geçiş süreleri
            setTimeout(() => { document.body.classList.add('slogan-visible'); }, 800); 
            setTimeout(() => { document.body.classList.add('loaded'); }, 2500); 
        }

        window.addEventListener('load', startExitSequence);
        setTimeout(startExitSequence, FORCED_LIMIT);

        // --- PARTICLE TEXT LOADER (ORİJİNAL MANTIK) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        let loadProgress = 0.0;
        let targetProgress = 0.0;
        let mainText = "COSMOS.LAB STUDIO";

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();

        const fontSize = Math.min(window.innerWidth / 12, 80); 
        ctx.font = `900 ${fontSize}px 'Courier New', monospace`;
        
        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX;
                this.targetY = targetY;
                const angle = Math.random() * Math.PI * 2; 
                const radius = Math.random() * (canvas.width * 0.8); 
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                this.x = centerX + Math.cos(angle) * radius;
                this.y = centerY + Math.sin(angle) * radius;
                this.size = Math.random() * 1.5 + 0.5; 
                this.baseOpacity = Math.random() * 0.6 + 0.4; 
            }
            draw() {
                let currentOpacity = this.baseOpacity + (loadProgress * (1 - this.baseOpacity));
                ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
                ctx.beginPath();
                ctx.rect(this.x, this.y, this.size, this.size);
                ctx.fill();
            }
            update() {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let speed = 0.04 + (loadProgress * 0.1);
                if(Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3 && loadProgress > 0.9) {
                    this.x = this.targetX; this.y = this.targetY;
                } else {
                    this.x += dx * speed;
                    this.y += dy * speed;
                }
            }
        }

        function initParticles() {
            particlesArray = [];
            const textWidth = ctx.measureText(mainText).width;
            const startX = (canvas.width - textWidth) / 2;
            const startY = canvas.height / 2;
            ctx.fillStyle = 'white';
            ctx.fillText(mainText, startX, startY);
            const textCoordinates = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            const step = window.innerWidth < 768 ? 4 : 2; // Performans ayarı
            for (let y = 0; y < textCoordinates.height; y += step) {
                for (let x = 0; x < textCoordinates.width; x += step) {
                    if (textCoordinates.data[(y * 4 * textCoordinates.width) + (x * 4) + 3] > 128) {
                        particlesArray.push(new Particle(x, y));
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (loadProgress < targetProgress) loadProgress += 0.008;

            if(loadProgress > 0.5) {
                let textOpacity = (loadProgress - 0.5) * 2;
                ctx.save();
                ctx.globalAlpha = Math.min(textOpacity, 1);
                ctx.fillStyle = '#FFFFFF';
                const textWidth = ctx.measureText(mainText).width;
                ctx.fillText(mainText, (canvas.width - textWidth) / 2, canvas.height / 2);
                ctx.restore();
            }

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            if (!document.body.classList.contains('loaded')) requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        let simulationInterval = setInterval(() => {
            if(targetProgress < 0.7) targetProgress += 0.02;
        }, 100);

        // --- DATA LOADER (ORİJİNAL) ---
        document.getElementById('logo').innerText = siteContent.header.title;
        const nav = document.getElementById('menu');
        siteContent.header.menu.forEach(item => { nav.innerHTML += `<a href="${item.link}">${item.text}</a>`; });
        document.getElementById('who-title').innerText = siteContent.about.whoWeAreTitle;
        document.getElementById('who-text').innerText = siteContent.about.whoWeAreText;
        document.getElementById('what-title').innerText = siteContent.about.whatWeDoTitle;
        document.getElementById('what-text').innerText = siteContent.about.whatWeDoText;
        document.getElementById('auto-title').innerText = siteContent.automation.title;
        document.getElementById('auto-desc').innerText = siteContent.automation.description;
        document.getElementById('contact-info').innerHTML = `${siteContent.contact.email}<br>${siteContent.contact.phone}<br>${siteContent.contact.location}`;

        // --- SLIDER LOGIC ---
        let allImages = [];
        function renderSlider(wrapperId, dataItems) {
            const wrapper = document.getElementById(wrapperId);
            dataItems.forEach((item) => {
                let startIndex = allImages.length;
                item.images.forEach(img => allImages.push(img));
                const first = item.images[0];
                const isVid = first.endsWith('.mp4');
                wrapper.innerHTML += `
                    <div class="slide-item" onclick="openLightbox(${startIndex})">
                        ${isVid ? `<video src="${first}" class="slide-media" autoplay loop muted playsinline preload="metadata"></video>` 
                               : `<img src="${first}" class="slide-media">`}
                        <div class="caption"><div>${item.title}</div><span>[${item.images.length} items]</span></div>
                    </div>`;
            });
        }
        renderSlider('project-slider', siteContent.projects);
        renderSlider('auto-slider', siteContent.automation.items);

        function manualScroll(wrapperId, direction) {
            const wrapper = document.getElementById(wrapperId);
            const itemWidth = wrapper.querySelector('.slide-item').offsetWidth + 20;
            wrapper.scrollBy({ left: direction * itemWidth, behavior: 'smooth' });
        }

        // --- LIGHTBOX LOGIC ---
        let currentIndex = 0;
        const lb = document.getElementById('lightbox');
        const lbStage = document.getElementById('lb-stage');
        const lbCounter = document.getElementById('lb-counter');

        function openLightbox(index) {
            currentIndex = index; renderLightboxContent(); lb.style.display = 'block'; document.body.style.overflow = 'hidden';
        }
        function closeLightbox() { lb.style.display = 'none'; document.body.style.overflow = ''; }
        function changeSlide(step) {
            currentIndex = (currentIndex + step + allImages.length) % allImages.length;
            renderLightboxContent();
        }
        function renderLightboxContent() {
            const url = allImages[currentIndex];
            lbStage.innerHTML = url.endsWith('.mp4') ? `<video src="${url}" class="lb-main-media" autoplay loop muted playsinline></video>` : `<img src="${url}" class="lb-main-media">`;
            lbCounter.innerText = `${currentIndex + 1} / ${allImages.length}`;
        }
    </script>
</body>
</html>
