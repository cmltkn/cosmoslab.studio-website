<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://www.google-analytics.com">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5F9CJGDQ4N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5F9CJGDQ4N');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmos.Lab Studio</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <style>
        /* --- 1. TEMEL AYARLAR VE KUSURSUZ MATEMATİK --- */
        :root {
            --visible-projects: 7; 
            --active-span: 5;      
            --gap-size: 10px;      
        }
        
        body { 
            background-color: #0e0e0e; color: #f0f0f0; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; overflow-x: hidden; touch-action: auto; 
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 2. LOADER --- */
        #loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease-in-out;
            direction: ltr !important; text-align: center;
        }
        canvas#particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #loader-slogan {
            position: absolute; top: calc(50% + 80px); transform: translateY(-50%);
            font-size: 1.1rem; letter-spacing: 8px; color: #cccccc; 
            opacity: 0; transition: opacity 0.8s ease-out;
            text-transform: uppercase; font-family: 'Courier New', Courier, monospace;
            text-align: center; width: 100%; font-weight: bold;
        }
        .loaded #loader-container { opacity: 0; pointer-events: none; }
        .slogan-visible #loader-slogan { opacity: 1; }

        /* --- 3. HEADER & SITE STYLES --- */
        header { 
            padding: 2rem 3rem; width: 100%; box-sizing: border-box;
            position: sticky; top: 0; background: rgba(14, 14, 14, 0.95); 
            z-index: 100; display: flex; justify-content: space-between; 
            border-bottom: 1px solid #333; align-items: center;
            backdrop-filter: blur(10px); 
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -2px; }
        .header-right { display: flex; align-items: center; gap: 30px; }
        nav { display: flex; gap: 20px; }
        nav a { color: #888; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: #fff; }

        .lang-switch {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.8rem; font-weight: bold;
            border-left: 1px solid #444; padding-left: 20px;
        }
        .lang-btn { color: #555; cursor: pointer; transition: 0.3s; padding: 2px; }
        .lang-btn:hover { color: #fff; }
        .lang-btn.active { color: #fff; text-decoration: underline; }

        section { padding: 1.2rem 0; max-width: 70%; margin: 0 auto; scroll-margin-top: 100px; }
        h2 { font-size: 1.8rem; margin-top: 0; margin-bottom: 1rem; border-left: 4px solid #fff; padding-left: 15px; text-transform: uppercase; }
        #auto-title { margin-top: 50px; } /* SADECE Teknoloji başlığını yukarıdan 50px uzaklaştırır */
        p { color: #bfbfbf; font-weight: 600; max-width: 100%; line-height: 1.6; margin-bottom: 1.5rem; }
        p b, p strong { color: #ffffff; font-weight: 900; letter-spacing: 1px; }

        /* --- 4. ABOUT SECTION --- */
        .about-layout { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            column-gap: 50px; /* Sağ ve sol sütun arasındaki 50px mesafeyi koruduk */
            row-gap: 5px;     /* ALT ALTA olan kutuların mesafesini neredeyse sıfırladık */
            margin-bottom: 30px; 
        }
        #who-block { grid-column: 1; grid-row: 1; }
        #who-block p { margin-bottom: 0; } /* Paragrafın altındaki o görünmez boşluğu sildik attık */
        #what-block { grid-column: 2; grid-row: 1 / span 2; }
        #team-block { grid-column: 1; grid-row: 2; }
        #team-profile-container { grid-column: 1 / span 2; grid-row: 3; width: 100%; }

        /* --- 5. TEAM KARTLARI (KOMPAKT VERSİYON) --- */
        .team-desc {
            font-size: 0.85rem; color: #888; font-style: italic;
            margin-top: 15px; /* Burayı 0'dan 15px'e çıkardık, hafifçe aşağı ittik */
            margin-bottom: 25px; border-left: 2px solid #333;
            padding-left: 15px; max-width: 90%; line-height: 1.6;
        }
        .team-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; /* Kartlar arası boşluğu biraz daralttık */
        }
        .partner-card {
            border: 1px solid #333; 
            padding: 12px; /* İç boşluğu 20px'den 12px'e indirdik (%40 küçülme) */
            cursor: pointer;
            transition: all 0.3s ease; 
            background-color: #0a0a0a; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
            justify-content: space-between;
            position: relative; 
            overflow: hidden; 
            min-height: 70px; /* Yüksekliği 120px'den 70px'e çektik (yaklaşık %50 küçülme) */
        }
        .partner-card:hover, .partner-card.active { border-color: #fff; transform: translateY(-2px); }
        
        /* Yazı boyutlarını kartla orantılı küçülttük */
        .partner-name { color: #fff; font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; position: relative; z-index: 2; }
        .partner-role { color: #666; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; position: relative; z-index: 2; }
        
        .card-action {
            margin-top: 8px; 
            padding-top: 8px; 
            border-top: 1px dashed #333; 
            font-size: 0.65rem; 
            color: #555; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: all 0.3s ease; 
            position: relative; 
            z-index: 2;
        }
        .partner-card:hover .card-action, .partner-card.active .card-action { color: #fff; border-top-color: #666; }
        .action-arrow { transition: transform 0.3s ease; font-size: 0.75rem; }
        .partner-card:hover .action-arrow, .partner-card.active .action-arrow { transform: translateX(5px); }


        #what-block p { margin-bottom: 0; } /* Yazının altındaki boşluğu sıfırladık */
        #what-img { 
            width: 100%; 
            display: block; 
            height: auto; 
            border: none; 
            margin-top: 10px; /* Yazıdan hemen sonra başlaması için çok küçük bir pay */
        }

        /* --- 6. OPTİMİZE EDİLMİŞ SONSUZ AKORDİYON --- */
        .accordion-container { 
            position: relative; 
            width: 100%; 
            margin-top: 20px; 
            overflow: hidden; 
        }
        
        .accordion-wrapper { 
            display: flex; 
            width: 100%; 
            height: 65vh; 
            overflow-x: auto; 
            /* scroll-snap-type: x mandatory; <- Bu varsayılanı JS ile kontrol edeceğiz */
            scrollbar-width: none; 
            gap: var(--gap-size); 
            scroll-behavior: auto;
        }
        /* Dokunmatik cihazlarda yumuşak kayma için başlangıçta mıknatıs açık olsun */
        .accordion-wrapper.snapping-active {
            scroll-snap-type: x mandatory;
        }
        .accordion-wrapper::-webkit-scrollbar { display: none; }
        
        .accordion-panel {
            flex: 0 0 calc((100% - (var(--gap-size) * (var(--visible-projects) - 1))) / var(--visible-projects));
            height: 100%;
            border-radius: 0; 
            background-size: cover; 
            background-position: center;
            position: relative; 
            cursor: pointer; 
            transition: flex 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden; 
            border: 1px solid #333;
            scroll-snap-align: center;
        }
        
        .accordion-panel.active { 
            flex: 0 0 calc((((100% - (var(--gap-size) * (var(--visible-projects) - 1))) / var(--visible-projects)) * var(--active-span)) + (var(--gap-size) * (var(--active-span) - 1))); 
            border-color: #fff; 
            cursor: default; 
        }
        
        .panel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end;
            padding: 30px; box-sizing: border-box; transition: background 0.6s ease;
        }
        .accordion-panel.active .panel-overlay { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%); }
        
        .panel-title {
            font-size: 1.4rem; font-weight: bold; color: #fff; margin: 0; white-space: nowrap;
            transform-origin: left bottom; transform: rotate(-90deg) translateX(0); 
            transition: transform 0.6s ease, font-size 0.6s ease;
            position: absolute; bottom: 30px; left: 50px; text-shadow: 2px 2px 12px rgba(0,0,0,0.9);
        }
        .accordion-panel.active .panel-title {
            transform: rotate(0deg) translateX(0); font-size: 2.5rem; position: relative; left: 0; bottom: 0;
        }

        /* --- 7. CASE STUDY --- */
        #case-study-container, #team-profile-container {
            margin-top: 60px; padding-top: 60px; border-top: 1px solid #333;
            display: none; opacity: 0; transition: opacity 0.8s ease;
        }
        .case-study-header { margin-bottom: 30px; }
        .case-study-header strong { display: block; font-size: 2.2rem; color: #fff; margin-top: 10px; text-transform: uppercase; }
        .case-study-body { display: flow-root; color: #ccc; }
        
        .case-study-floating-images { float: left; width: 45%; margin-right: 40px; margin-bottom: 20px; }
        .case-study-floating-images img { width: 100%; border: 1px solid #222; margin-bottom: 20px; display: block; }
        
        #team-profile-container .case-study-floating-images { width: 20%; max-width: 220px; margin-right: 30px; }
        .case-study-body p { line-height: 1.8; font-size: 1.05rem; margin-top: 0; margin-bottom: 30px; }

        /* --- 8. SLIDER & BUTONLAR --- */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .slider-wrapper { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .slide-item { 
            min-width: 700px; display: flex; flex-direction: column; position: relative; cursor: pointer; 
            border: 1px solid #333; background: #000; transition: border-color 0.3s; flex-shrink: 0; 
            scroll-snap-align: start; scroll-snap-stop: always;
        }
        .slide-item:hover { border-color: #fff; }
        .slide-media { width: 100%; height: 500px; object-fit: contain; display: block; background-color: #000; pointer-events: none; }
        .caption { width: 100%; background: #121212; padding: 18px 22px; box-sizing: border-box; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .caption div:first-child { color: #cccccc; font-size: 0.95rem; font-weight: 600; letter-spacing: 1px; line-height: 1.4; text-transform: uppercase; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; }
        .caption span { font-size: 0.75rem !important; color: #555 !important; font-weight: normal; letter-spacing: 0.5px; font-family: sans-serif; }
        .slide-item:hover .caption div:first-child { color: #fff; }
        .slide-item:hover .caption { border-top-color: #444; background: #161616; }
        
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.9); color: #fff; border: 1px solid #555; width: 50px; height: 50px; cursor: pointer; z-index: 50; font-size: 24px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .slider-btn:hover { border-color: #fff; background: #222; }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        /* --- 9. LIGHTBOX --- */
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        .lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
        .lb-main-media { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; user-select: none; -webkit-user-drag: none; will-change: transform; }
        video.lb-main-media { z-index: 10; pointer-events: none; }
        .lb-ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 50px; cursor: pointer; padding: 20px; pointer-events: auto; text-shadow: 0 0 10px #000; background: rgba(0,0,0,0.2); border-radius: 5px; transition: all 0.3s ease; }
        .lb-prev-arrow { left: 10px; } .lb-next-arrow { right: 10px; }
        .close-lb { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 40px; cursor: pointer; pointer-events: auto; text-shadow: 0 0 10px #000; z-index: 30; }
        .rotate-btn { display: none; position: absolute; top: 25px; right: 80px; color: #fff; font-size: 30px; cursor: pointer; pointer-events: auto; border: 1px solid #fff; border-radius: 50%; width: 40px; height: 40px; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 30; transition: all 0.3s ease; }
        .rotate-btn.active { background: #fff; color: #000; transform: rotate(90deg); }
        .lb-counter { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #cccccc; font-size: 0.9rem; letter-spacing: 2px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
        .rotate-mode .lb-prev-arrow { top: 10px; left: 50%; transform: translateX(-50%) rotate(90deg); }
        .rotate-mode .lb-next-arrow { top: auto; bottom: 10px; left: 50%; transform: translateX(-50%) rotate(90deg); }

        /* --- 10. İLETİŞİM (CONTACT) --- */
        #contact-section { border-top: 1px solid #333; margin-top: 60px; padding-top: 40px; }
        .contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; margin-top: 30px; }
        .contact-info-block { display: flex; flex-direction: column; justify-content: flex-start; }
        
        .contact-details { 
            font-family: 'Courier New', Courier, monospace !important;
            color: #888; font-size: 1.05rem; line-height: 2.4; 
        }
        .contact-details span { 
            display: inline-block; width: 140px; color: #ccc; font-weight: bold; letter-spacing: 1px; 
        }
        .contact-link { color: #fff; text-decoration: none; transition: color 0.3s; }
        .contact-link:hover { color: #aaa; text-decoration: underline; }
        
        .minimal-form { display: flex; flex-direction: column; gap: 15px; justify-content: flex-start; margin-top: -80px; padding-top: 0; }
        .minimal-form input, .minimal-form textarea { background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; padding: 10px 0; font-family: 'Courier New', Courier, monospace; font-size: 0.95rem; transition: border-color 0.3s; }
        .minimal-form input:focus, .minimal-form textarea:focus { outline: none; border-bottom-color: #fff; }
        .minimal-form textarea { resize: none; height: 50px; } 
        .minimal-form button { background: transparent; color: #fff; border: 1px dashed #333; padding: 15px; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; font-weight: bold; text-align: left; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .minimal-form button:hover { border-color: #fff; background: #111; }
        .footer-bottom { margin-top: 80px; padding-top: 20px; padding-bottom: 20px; border-top: 1px solid #222; font-size: 0.75rem; color: #555; text-align: center; }

        /* --- 11. ARAPÇA (RTL) ÖZEL AYARLARI --- */
        html[dir="rtl"] body { font-family: 'Tahoma', 'Courier New', sans-serif; }
        html[dir="rtl"] h2 { border-left: none; border-right: 4px solid #fff; padding-left: 0; padding-right: 20px; }
        html[dir="rtl"] .team-desc { border-left: none; border-right: 3px solid #333; padding-left: 0; padding-right: 15px; }
        html[dir="rtl"] .lang-switch { border-left: none; border-right: 1px solid #444; padding-left: 0; padding-right: 20px; }
        html[dir="rtl"] .caption { text-align: right; }
        html[dir="rtl"] .action-arrow { transform: rotate(180deg); }
        html[dir="rtl"] .partner-card:hover .action-arrow { transform: translateX(-5px) rotate(180deg); }

        /* --- 12. RESPONSIVE EKRAN DARALMA --- */
        @media (max-width: 1400px) { :root { --visible-projects: 5; --active-span: 3; } }
        @media (max-width: 1100px) { :root { --visible-projects: 4; --active-span: 2; } }
        @media (max-width: 900px) { 
            :root { --visible-projects: 3; --active-span: 2; } 
            
            header { padding: 1.5rem 1rem; flex-direction: column; align-items: flex-start; gap: 20px; position: sticky; }
            .lang-switch { position: absolute; top: 2rem; right: 1rem; border-left: none; padding-left: 0; }
            .header-right { width: 100%; justify-content: flex-start; margin-top: 5px; }
            nav { gap: 15px 20px; flex-wrap: wrap; }
            
            .about-layout { display: flex; flex-direction: column; gap: 10px; }
            #who-block { order: 1; }
            #team-block { order: 2; }
            #team-profile-container { order: 3; }
            #what-block { order: 4; }

            section { max-width: 90%; } 
            .team-grid { grid-template-columns: 1fr; gap: 15px; } 

            .case-study-floating-images { float: none; width: 100%; margin-right: 0; }
            #team-profile-container .case-study-floating-images { width: 45%; max-width: 180px; margin-right: 20px; float: left; }
            
            .slide-item { min-width: 90vw; width: 90vw; margin-right: 15px; } 
            .slide-media { height: 300px; }
            .slider-btn { display: none; } 
            .rotate-btn { display: flex; }
            .lb-arrow { font-size: 30px; padding: 15px; }

            .contact-layout { grid-template-columns: 1fr; gap: 40px; }
        }
        
        @media (max-width: 600px) { 
            :root { --visible-projects: 1.2; } 
            .accordion-panel.active { flex: 0 0 95%; }
        }

        @media (max-width: 900px) {
            html[dir="rtl"] header { align-items: flex-end; }
            html[dir="rtl"] .lang-switch { right: auto; left: 1rem; border-right: none; }
        }
    </style>
</head>
<body>

    <div id="loader-container" dir="ltr">
        <canvas id="particle-canvas"></canvas>
        <div id="loader-slogan">FROM CHAOS TO COSMOS</div>
    </div>

    <header>
        <div class="logo" id="logo">COSMOS.LAB STUDIO</div>
        <div class="header-right">
            <nav id="menu"></nav>
            <div class="lang-switch">
                <span onclick="setLanguage('en')" class="lang-btn" id="btn-en">EN</span>
                <span style="color:#555">/</span>
                <span onclick="setLanguage('tr')" class="lang-btn" id="btn-tr">TR</span>
                <!--
                <span style="color:#555">/</span>
                <span onclick="setLanguage('ru')" class="lang-btn" id="btn-ru">RU</span>
                <span style="color:#555">/</span>
                <span onclick="setLanguage('ar')" class="lang-btn" id="btn-ar">AR</span>
                -->
            </div>
        </div>
    </header>

    <section id="about-section">
        <div class="about-layout">
            <div id="who-block">
                <h2 id="who-title"></h2>
                <p id="who-text"></p>
            </div>
            <div id="team-block">
                <div class="team-desc" id="team-desc-text"></div>
                <div class="team-grid" id="team-container"></div>
            </div>
            <div id="what-block">
    <h2 id="what-title"></h2>
    <p id="what-text"></p>
    <div id="what-img-container"></div> </div>
            </div>
        </div>
    </section>

    <section id="projects-section">
        <h2 id="projects-title">SELECTED PROJECTS</h2>
        <div class="accordion-container" id="project-slider-wrapper">
        </div>
    </section>

    <section id="automation-section">
        <h2 id="auto-title"></h2>
        <p id="auto-desc"></p>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('auto-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="auto-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('auto-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="contact-section">
        <h2 id="contact-title"></h2>
        <div class="contact-layout">
            <div class="contact-info-block">
                <div class="contact-details" id="contact-details"></div>
            </div>
            
            <div class="contact-form-block">
                <form action="https://formspree.io/f/xwvypgpa" method="POST" class="minimal-form">
                    <input type="text" name="name" id="form-name" required>
                    <input type="email" name="email" id="form-email" required>
                    <textarea name="message" id="form-message" required></textarea>
                    <button type="submit" id="form-send"></button>
                </form>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Cosmos.Lab Studio. All rights reserved.
        </div>
    </section>

    <div class="lightbox" id="lightbox">
        <div class="lb-stage" id="lb-stage"></div>
        <div class="lb-ui-layer" id="lb-ui">
            <span class="close-lb" onclick="closeLightbox()">&times;</span>
            <div class="rotate-btn" id="rotate-btn" onclick="toggleRotationMode()">&#8635;</div>
            <div class="lb-arrow lb-prev-arrow" onclick="changeSlide(-1)">&#10094;</div>
            <div class="lb-arrow lb-next-arrow" onclick="changeSlide(1)">&#10095;</div>
            <div class="lb-counter" id="lb-counter"></div>
        </div>
    </div>

    <script src="content.js"></script>
    <script>
        // --- 1. DİL YÖNETİMİ ---
        const urlParams = new URLSearchParams(window.location.search);
        const langFromUrl = urlParams.get('lang');
        let currentLang = langFromUrl || 'en';
        if (typeof siteContent !== 'undefined' && !siteContent[currentLang]) { currentLang = 'en'; }

        function setLanguage(lang) {
            if(typeof siteContent === 'undefined' || !siteContent[lang]) return;
            currentLang = lang;
            if (typeof gtag === 'function') {
                gtag('event', 'language_switch', { language: lang });
            }
            try { localStorage.setItem('siteLang', lang); } catch(e) {}
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + lang;
            window.history.pushState({path: newUrl}, '', newUrl);
            const htmlTag = document.documentElement;
            if (lang === 'ar') { htmlTag.setAttribute('dir', 'rtl'); htmlTag.setAttribute('lang', 'ar'); } 
            else { htmlTag.setAttribute('dir', 'ltr'); htmlTag.setAttribute('lang', lang); }
            renderPage();
        }

        function renderPage() {
            if (typeof siteContent === 'undefined') return;
            const data = siteContent[currentLang];

        // --- FİNAL: KUSURSUZ HESAPLANMIŞ SONSUZ AKORDİYON ---
        function renderAccordion(wrapperId, dataItems) {
            const container = document.getElementById(wrapperId);
            if(!container || dataItems.length === 0) return;
            
            container.innerHTML = `
                <button class="slider-btn prev-btn" onclick="manualScroll('accordion-inner', -1)">&#10094;</button>
                <div class="accordion-wrapper snapping-active" id="accordion-inner"></div>
                <button class="slider-btn next-btn" onclick="manualScroll('accordion-inner', 1)">&#10095;</button>

            let caseContainer = document.getElementById('case-study-container');
            if(!caseContainer) {
                caseContainer = document.createElement('div');
                caseContainer.id = 'case-study-container';
                container.insertAdjacentElement('afterend', caseContainer);
            }

            const wrapper = document.getElementById('accordion-inner');
            const totalItems = dataItems.length;
            
            const loopCount = 4; 
            for(let i = 0; i < loopCount; i++) {
                dataItems.forEach((item, originalIndex) => {
                    wrapper.innerHTML += `
                        <div class="accordion-panel" style="background-image: url('${item.thumbnail}')" onclick="toggleAccordion(this, ${originalIndex})">
                            <div class="panel-overlay">
                                <h3 class="panel-title">${item.title}</h3>
                            </div>
                        </div>
                    `;
                });
            }

            setTimeout(() => {
                const items = Array.from(wrapper.children);
                if(items.length === 0) return;
                
                const gap = 10; 
                const itemWidth = items[0].offsetWidth + gap; 
                const setWidth = itemWidth * totalItems;
                
                // Mıknatısı (scroll-snap) devreden çıkarıp ortaya konumlama yapıyoruz
                wrapper.classList.remove('snapping-active');
                wrapper.scrollLeft = setWidth; 
                
                // Sonra mıknatısı tekrar devreye alıyoruz
                setTimeout(() => { wrapper.classList.add('snapping-active'); }, 50);

                wrapper.addEventListener('scroll', () => {
                    const scrollLeft = wrapper.scrollLeft;
                    const scrollWidth = wrapper.scrollWidth;
                    const clientWidth = wrapper.clientWidth;
                    const currentItemWidth = items[0].offsetWidth + gap; 
                    const currentSetWidth = currentItemWidth * totalItems;

                    if (scrollLeft <= currentItemWidth) {
                        wrapper.classList.remove('snapping-active');
                        wrapper.scrollLeft = scrollLeft + currentSetWidth;
                        setTimeout(() => { wrapper.classList.add('snapping-active'); }, 50);
                    } 
                    else if (scrollLeft >= scrollWidth - clientWidth - currentItemWidth) {
                        wrapper.classList.remove('snapping-active');
                        wrapper.scrollLeft = scrollLeft - currentSetWidth;
                        setTimeout(() => { wrapper.classList.add('snapping-active'); }, 50);
                    }
                });
            }, 200);
        }

        function toggleAccordion(clickedPanel, originalIndex) {
            const target = document.getElementById('case-study-container');
            const wrapper = document.getElementById('accordion-inner');
            
            // 1. İnatçı CSS mıknatısını kapat (Scroll-Snap iptali)
            wrapper.classList.remove('snapping-active');
            
            if (clickedPanel.classList.contains('active')) {
                clickedPanel.classList.remove('active');
                if (target) {
                    target.style.opacity = '0';
                    setTimeout(() => { target.style.display = 'none'; }, 500);
                }
                // Kart kapanınca mıknatısı geri aç
                setTimeout(() => { wrapper.classList.add('snapping-active'); }, 750);
                return; 
            }
            
            // Tüm aktif kartları kapat
            Array.from(wrapper.children).forEach(p => p.classList.remove('active'));
            clickedPanel.classList.add('active');
            
            const data = siteContent[currentLang].projects;
            showCaseStudy(originalIndex, data);
            
            if (target) {
                target.style.display = 'block';
                setTimeout(() => { target.style.opacity = '1'; }, 50);
            }
            
            // 2. KUSURSUZ HESAPLAMA VE KAYDIRMA (Hareketli hedef sorunu çözüldü)
            setTimeout(() => {
                const gap = 10;
                // Kapalı (normal) bir panelin genişliğini bul
                const inactivePanel = Array.from(wrapper.children).find(p => p !== clickedPanel) || clickedPanel;
                const normalWidth = inactivePanel.offsetWidth;
                
                // Tıklanan kartın sırasını bul
                const panelIndex = Array.from(wrapper.children).indexOf(clickedPanel);
                
                // Ekran genişliğine göre solda kaç kart kalacağını hesapla (Masaüstü: 1, Mobil: 0)
                const cardsOnLeft = window.innerWidth > 900 ? 1 : 0; 
                
                // Kartın gideceği milimetrik konumu hesapla
                const targetScroll = Math.max(0, (panelIndex - cardsOnLeft) * (normalWidth + gap));

                // Şaşmaz bir şekilde oraya kaydır
                wrapper.scrollTo({
                    left: targetScroll,
                    behavior: 'smooth'
                });
                
                // 3. Animasyon ve kayma bittiğinde mıknatısı geri aç
                setTimeout(() => {
                    wrapper.classList.add('snapping-active');
                }, 800);
                
            }, 50); // Tarayıcı CSS'i hesaplasın diye nefes payı
        }

        // --- SLIDER (OTOMASYON) ---
        function renderSlider(wrapperId, dataItems) {
            const wrapper = document.getElementById(wrapperId);
            if(!wrapper) return;
            wrapper.innerHTML = "";
            wrapper.className = 'slider-wrapper';

            dataItems.forEach((item, index) => {
                let globalIndex = allImages.length;
                let coverImage = "";

                if (item.images && item.images.length > 0) {
                    item.images.forEach(img => allImages.push(img));
                    coverImage = item.images[0];
                } else if (item.thumbnail) {
                    allImages.push(item.thumbnail);
                    if(item.case_images) item.case_images.forEach(img => allImages.push(img));
                    coverImage = item.thumbnail;
                }

                let html = `
                <div class="slide-item" onclick="openLightbox(${globalIndex})">
                    ${isVideo(coverImage) ? `<video src="${coverImage}" class="slide-media" autoplay loop muted playsinline></video>` : `<img src="${coverImage}" class="slide-media" loading="lazy">`}
                    <div class="caption">
                        <div>${item.title}</div>
                        <span>VIEW DETAILS / GÖRÜNTÜLE</span>
                    </div>
                </div>`;
                wrapper.innerHTML += html;
            });
            setupInfiniteLoop(wrapper);
        }

        function setupInfiniteLoop(wrapper) {
            const items = Array.from(wrapper.children);
            if(items.length < 2) return; 
            const firstClone = items[0].cloneNode(true);
            const lastClone = items[items.length - 1].cloneNode(true);
            
            if(firstClone.querySelector('video')) { let v = firstClone.querySelector('video'); v.muted = true; videoObserver.observe(v); }
            if(lastClone.querySelector('video')) { let v = lastClone.querySelector('video'); v.muted = true; videoObserver.observe(v); }

            wrapper.appendChild(firstClone); 
            wrapper.insertBefore(lastClone, items[0]); 
            const itemWidth = items[0].offsetWidth + 20; 
            wrapper.scrollLeft = itemWidth;
            wrapper.addEventListener('scroll', () => {
                const scrollLeft = wrapper.scrollLeft; const scrollWidth = wrapper.scrollWidth; const clientWidth = wrapper.clientWidth;
                if (scrollLeft >= scrollWidth - clientWidth - 5) wrapper.scrollLeft = itemWidth; 
                if (scrollLeft <= 0) wrapper.scrollLeft = scrollWidth - (2 * clientWidth) + 10; 
            });
        }

            const itemWidth = sampleItem.offsetWidth + gap;
            
            wrapper.scrollBy({ left: direction * itemWidth, behavior: 'smooth' });
        }
