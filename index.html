<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMOS.LAB STUDIO</title>
    <style>
        /* --- TEMEL AYARLAR --- */
        body { background-color: #0e0e0e; color: #f0f0f0; font-family: 'Courier New', Courier, monospace; margin: 0; overflow-x: hidden; }
        
        header { 
            padding: 2rem 3rem; width: 100%; box-sizing: border-box;
            position: sticky; top: 0; background: rgba(14, 14, 14, 0.95); z-index: 100; 
            display: flex; justify-content: space-between; border-bottom: 1px solid #333; 
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -2px; }
        nav a { color: #888; text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: #fff; }

        section { padding: 2rem 0; max-width: 70%; margin: 0 auto; scroll-margin-top: 100px; }
        h2 { font-size: 1.8rem; margin-bottom: 1rem; border-left: 4px solid #fff; padding-left: 15px; text-transform: uppercase; }
        p { color: #aaa; max-width: 800px; line-height: 1.6; margin-bottom: 1.5rem; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-bottom: 30px; }

        /* --- INFINITE SLIDER --- */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        
        .slider-wrapper { 
            display: flex; 
            overflow-x: auto; 
            gap: 20px; 
            padding-bottom: 20px; 
            scrollbar-width: none;
            
            /* SIKI SNAP AYARLARI */
            scroll-snap-type: x mandatory; 
            scroll-behavior: auto; /* JS ile kontrol edeceğimiz için smooth'u kapattık, yoksa loop bozulur */
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide-item { 
            min-width: 700px; 
            display: flex; flex-direction: column;
            position: relative; cursor: pointer; 
            border: 1px solid #333; background: #000;
            transition: border-color 0.3s; flex-shrink: 0; 
            
            /* SOLA YAPIŞMA */
            scroll-snap-align: start; 
            /* ORTADA KALMAYI ENGELLEME */
            scroll-snap-stop: always;
        }
        .slide-item:hover { border-color: #fff; }
        
        .slide-media { 
            width: 100%; height: 500px; object-fit: contain; display: block; background-color: #000;
        }
        
        .caption { 
            width: 100%; background: #151515; padding: 20px; font-size: 1rem; 
            color: #ccc; border-top: 1px solid #222; box-sizing: border-box; font-weight: bold; letter-spacing: 1px;
        }
        .slide-item:hover .caption { color: #fff; }

        .slider-btn { 
            position: absolute; top: 250px; transform: translateY(-50%); 
            background: rgba(0,0,0,0.9); color: #fff; border: 1px solid #555; 
            width: 50px; height: 50px; cursor: pointer; z-index: 50; 
            font-size: 24px; display: flex; align-items: center; justify-content: center;
        }
        .slider-btn:hover { background: #fff; color: #000; border-color: #fff; }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        /* --- LIGHTBOX (Ritmik & Net) --- */
        .lightbox { 
            display: none; position: fixed; z-index: 9999; 
            top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.98); 
            justify-content: center; align-items: center; overflow: hidden; 
        }
        .lb-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; gap: 20px; }

        .lb-media-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        /* ORTAK MEDYA STİLİ (Ritim Bozulmaması İçin) */
        .lb-main-media { 
            max-width: 80vw; max-height: 90vh; 
            object-fit: contain;
            transition: opacity 0.2s ease; /* Yumuşak geçiş */
        }
        
        /* Video Player Reset */
        video.lb-main-media { outline: none; border: none; }

        .lb-side-img {
            height: 50vh; max-width: 15vw; object-fit: cover;
            opacity: 0.2; filter: grayscale(100%); transition: 0.4s ease;
            cursor: pointer; border: 1px solid #333;
        }
        .lb-side-img:hover { opacity: 0.6; filter: grayscale(0%); border-color: #fff; }

        .lb-arrow { color: #fff; font-size: 40px; cursor: pointer; padding: 10px; user-select: none; z-index: 20; }
        .close-lb { position: absolute; top: 20px; right: 40px; color: #fff; font-size: 40px; cursor: pointer; z-index: 30;}
        .lb-counter { position: absolute; bottom: 30px; color: #555; font-size: 0.8rem; letter-spacing: 2px; z-index: 30;}

        /* Rotate Butonu */
        .rotate-btn {
            display: none;
            position: absolute; top: 20px; right: 100px; 
            color: #fff; font-size: 30px; cursor: pointer; z-index: 35;
            border: 1px solid #fff; border-radius: 50%; width: 40px; height: 40px;
            align-items: center; justify-content: center;
        }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) { 
            header { padding: 2rem 1rem; width: 100%; }
            section { max-width: 90%; } 
            .info-grid { grid-template-columns: 1fr; gap: 30px; }

            /* Slider: Yanları görünecek şekilde, Sola Snap */
            .slide-item { min-width: 85vw; margin-right: 10px; } 
            .slide-media { height: 350px; }

            .lb-side-img, .prev-btn, .next-btn, .lb-arrow { display: none; }
            .lb-main-media { max-width: 100vw; max-height: 80vh; }
            .rotate-btn { display: flex; }
        }

        /* --- AKILLI ROTASYON (MATEMATİKSEL FIT) --- */
        .rotated-90 {
            transform: rotate(90deg);
            /* Ekranın yüksekliği kadar genişlik, genişliği kadar yükseklik */
            width: 80vh !important; 
            height: 100vw !important;
            max-width: 90vh !important;
            max-height: 100vw !important;
            object-fit: contain !important;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo" id="logo"></div>
        <nav id="menu"></nav>
    </header>

    <section id="about-section">
        <div class="info-grid">
            <div>
                <h2 id="who-title"></h2>
                <p id="who-text"></p>
            </div>
            <div>
                <h2 id="what-title"></h2>
                <p id="what-text"></p>
            </div>
        </div>
    </section>

    <section id="projects-section">
        <h2>SELECTED PROJECTS</h2>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('project-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="project-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('project-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="automation-section">
        <h2 id="auto-title"></h2>
        <p id="auto-desc"></p>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('auto-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="auto-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('auto-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="contact-section" style="border-top: 1px solid #333; margin-top: 30px;">
        <h2>CONTACT</h2>
        <p id="contact-info"></p>
    </section>

    <div class="lightbox" id="lightbox">
        <span class="close-lb" onclick="closeLightbox()">&times;</span>
        <div class="rotate-btn" onclick="rotateImage()">&#8635;</div>
        
        <div class="lb-container">
            <img id="lb-img-prev" class="lb-side-img" onclick="changeSlide(-1)">
            <div class="lb-arrow" onclick="changeSlide(-1)">&#10094;</div>

            <div class="lb-media-wrapper">
                <div id="media-placeholder" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
                    </div>
            </div>

            <div class="lb-arrow" onclick="changeSlide(1)">&#10095;</div>
            <img id="lb-img-next" class="lb-side-img" onclick="changeSlide(1)">
        </div>
        <div class="lb-counter" id="lb-counter"></div>
    </div>

    <script src="content.js"></script>
    <script>
        document.getElementById('logo').innerText = siteContent.header.title;
        const nav = document.getElementById('menu');
        siteContent.header.menu.forEach(item => {
            nav.innerHTML += `<a href="${item.link}">${item.text}</a>`;
        });

        document.getElementById('who-title').innerText = siteContent.about.whoWeAreTitle;
        document.getElementById('who-text').innerText = siteContent.about.whoWeAreText;
        document.getElementById('what-title').innerText = siteContent.about.whatWeDoTitle;
        document.getElementById('what-text').innerText = siteContent.about.whatWeDoText;
        document.getElementById('auto-title').innerText = siteContent.automation.title;
        document.getElementById('auto-desc').innerText = siteContent.automation.description;
        document.getElementById('contact-info').innerHTML = `${siteContent.contact.email}<br>${siteContent.contact.location}`;

        let allImages = []; 

        function isVideo(url) { return url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.webm'); }
        function isMobile() { return window.innerWidth <= 768; }

        // --- INFINITE SLIDER LOGIC ---
        // Kartları klonlayıp sonsuz döngü hissi yaratacağız.
        
        function renderSlider(wrapperId, dataItems) {
            const wrapper = document.getElementById(wrapperId);
            
            // Orijinal öğeleri oluştur
            let originalSlides = "";
            dataItems.forEach((item) => {
                let globalIndex = allImages.length; 
                item.images.forEach(img => allImages.push(img));
                const firstMedia = item.images[0];
                let mediaHtml = isVideo(firstMedia) ? 
                    `<video src="${firstMedia}" class="slide-media" muted playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>` : 
                    `<img src="${firstMedia}" class="slide-media">`;

                // DATA-INDEX ile gerçek indexi saklıyoruz
                originalSlides += `
                    <div class="slide-item" data-index="${globalIndex}" onclick="openLightbox(${globalIndex})">
                        ${mediaHtml}
                        <div class="caption">
                            ${item.title}<br>
                            <span style="font-size:0.7em; color:#666;">[${item.images.length} items]</span>
                        </div>
                    </div>`;
            });

            // HTML'i yerleştir (Önce orijinaller)
            wrapper.innerHTML = originalSlides;

            // DOM'a yerleştikten sonra klonlama işlemi
            setTimeout(() => setupInfiniteLoop(wrapper), 100);
        }

        function setupInfiniteLoop(wrapper) {
            const items = Array.from(wrapper.children);
            if(items.length < 2) return; // Az eleman varsa klonlama

            const firstClone = items[0].cloneNode(true);
            const lastClone = items[items.length - 1].cloneNode(true);

            // Klonlara ID veya özel işaret ekle
            firstClone.classList.add('clone');
            lastClone.classList.add('clone');

            // Başa ve sona ekle
            wrapper.appendChild(firstClone); // Sona ilkin kopyasını
            wrapper.insertBefore(lastClone, items[0]); // Başa sonun kopyasını

            // Scroll'u "gerçek" ilk öğeye hizala (Klon değil)
            const itemWidth = items[0].offsetWidth + 20; // 20px gap
            wrapper.scrollLeft = itemWidth;

            // Scroll Dinleyici (Işınlanma Mantığı)
            wrapper.addEventListener('scroll', () => {
                const scrollLeft = wrapper.scrollLeft;
                const scrollWidth = wrapper.scrollWidth;
                const clientWidth = wrapper.clientWidth;

                // En sona geldik mi? (İlk öğenin klonuna)
                if (scrollLeft >= scrollWidth - clientWidth - 5) {
                    wrapper.scrollLeft = itemWidth; // Başa ışınla
                }
                // En başa geldik mi? (Son öğenin klonuna)
                if (scrollLeft <= 0) {
                    wrapper.scrollLeft = scrollWidth - (2 * clientWidth) + 10; // Sona ışınla (Basit hesap)
                    // Daha hassas ışınlanma:
                    wrapper.scrollLeft = wrapper.scrollWidth - (itemWidth * 2) - 20;
                }
            });

            // Klonlara tıklama olayını düzelt (JS ile eklenenlerde onclick string olarak kalır, çalışır)
        }

        function manualScroll(wrapperId, direction) {
            const wrapper = document.getElementById(wrapperId);
            const itemWidth = wrapper.querySelector('.slide-item').offsetWidth + 20;
            wrapper.scrollBy({ left: direction * itemWidth, behavior: 'smooth' });
        }

        renderSlider('project-slider', siteContent.projects);
        renderSlider('auto-slider', siteContent.automation.items);


        // --- LIGHTBOX (RHYTHM & LOOP) ---
        let currentIndex = 0;
        const lb = document.getElementById('lightbox');
        const mediaPlaceholder = document.getElementById('media-placeholder');
        const lbPrev = document.getElementById('lb-img-prev');
        const lbNext = document.getElementById('lb-img-next');
        const lbCounter = document.getElementById('lb-counter');

        // Lightbox açılınca
        function openLightbox(index) {
            currentIndex = index;
            updateLb();
            lb.style.display = 'flex';
            document.addEventListener('keydown', handleKey);

            // Mobilde direk yatay başlat (Döndür)
            setTimeout(() => {
                const activeMedia = document.querySelector('.lb-main-media');
                if(isMobile() && activeMedia && activeMedia.tagName === 'IMG') {
                    activeMedia.classList.add('rotated-90');
                }
            }, 50);
        }

        function closeLightbox() {
            lb.style.display = 'none';
            mediaPlaceholder.innerHTML = ""; // İçeriği temizle
            document.removeEventListener('keydown', handleKey);
        }

        function changeSlide(step) {
            currentIndex += step;
            // Sonsuz Döngü Mantığı (Loop)
            if (currentIndex >= allImages.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = allImages.length - 1;
            updateLb();
            
            // Mobilde geçişte de yatay kalsın
            if(isMobile()) {
                setTimeout(() => {
                    const activeMedia = document.querySelector('.lb-main-media');
                    if(activeMedia && activeMedia.tagName === 'IMG') {
                        activeMedia.classList.add('rotated-90');
                    }
                }, 10);
            }
        }

        function updateLb() {
            const currentUrl = allImages[currentIndex];
            let newContent = "";

            // Ritim bozulmaması için DOM'u tamamen silip yeniden oluşturuyoruz
            if (isVideo(currentUrl)) {
                newContent = `<video src="${currentUrl}" class="lb-main-media" autoplay loop muted playsinline></video>`;
            } else {
                newContent = `<img src="${currentUrl}" class="lb-main-media" ondblclick="toggleZoom(event)">`;
            }
            mediaPlaceholder.innerHTML = newContent;

            // Yan Görseller (Sonsuz loop için indeksler)
            let prevIndex = currentIndex - 1; if (prevIndex < 0) prevIndex = allImages.length - 1;
            let nextIndex = currentIndex + 1; if (nextIndex >= allImages.length) nextIndex = 0;

            lbPrev.src = isVideo(allImages[prevIndex]) ? "" : allImages[prevIndex];
            lbNext.src = isVideo(allImages[nextIndex]) ? "" : allImages[nextIndex];
            lbPrev.style.opacity = isVideo(allImages[prevIndex]) ? "0" : "0.2";
            lbNext.style.opacity = isVideo(allImages[nextIndex]) ? "0" : "0.2";
            lbCounter.innerText = `${currentIndex + 1} / ${allImages.length}`;
        }

        // ROTATE & ZOOM
        function rotateImage() {
            const img = document.querySelector('img.lb-main-media');
            if(!img) return;
            img.classList.toggle('rotated-90');
            // Rotate olunca zoom sıfırlansın
            img.style.transform = ""; 
        }

        function toggleZoom(event) {
            const img = event.target;
            if(img.classList.contains('rotated-90')) return; // Dönmüşse zoom yapma

            if (img.style.transform === "scale(2.5)") {
                img.style.transform = "scale(1)";
                img.style.cursor = "zoom-in";
            } else {
                const rect = img.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                img.style.transformOrigin = `${x}px ${y}px`;
                img.style.transform = "scale(2.5)";
                img.style.cursor = "zoom-out";
            }
        }

        function handleKey(e) {
            if(e.key === 'ArrowRight') changeSlide(1);
            if(e.key === 'ArrowLeft') changeSlide(-1);
            if(e.key === 'Escape') closeLightbox();
        }
        lb.addEventListener('click', (e) => { 
            if(e.target === lb || e.target.id === 'media-placeholder') closeLightbox(); 
        });
    </script>
</body>
</html>
