<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMOS.LAB STUDIO</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <style>
        /* --- TEMEL AYARLAR --- */
        body { 
            background-color: #0e0e0e; 
            color: #f0f0f0; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            overflow-x: hidden; 
            touch-action: auto; 
            -webkit-tap-highlight-color: transparent;
        }

        /* --- LOADER CONTAINER (Optimized) --- */
        #loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; 
            z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        canvas#particle-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        #loader-slogan {
            position: absolute;
            top: calc(50% + 80px); 
            transform: translateY(-50%);
            font-size: 1.1rem; 
            letter-spacing: 8px; 
            color: #aaa; 
            opacity: 0; 
            transition: opacity 0.6s ease-out;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        
        .loaded #loader-container { opacity: 0; pointer-events: none; }
        .slogan-visible #loader-slogan { opacity: 1; }

        /* --- HEADER & SECTION STYLES --- */
        header { 
            padding: 2rem 3rem; width: 100%; box-sizing: border-box;
            position: sticky; top: 0; background: rgba(14, 14, 14, 0.95); z-index: 100; 
            display: flex; justify-content: space-between; border-bottom: 1px solid #333; 
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -2px; }
        nav a { color: #888; text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: #fff; }

        section { padding: 2rem 0; max-width: 70%; margin: 0 auto; scroll-margin-top: 100px; }
        h2 { font-size: 1.8rem; margin-bottom: 1rem; border-left: 4px solid #fff; padding-left: 15px; text-transform: uppercase; }
        p { color: #aaa; max-width: 800px; line-height: 1.6; margin-bottom: 1.5rem; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-bottom: 30px; }

        /* --- SLIDER & MEDIA --- */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .slider-wrapper { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide-item { 
            min-width: 700px; display: flex; flex-direction: column;
            position: relative; cursor: pointer; border: 1px solid #333; background: #000;
            transition: border-color 0.3s; flex-shrink: 0; 
            scroll-snap-align: start; scroll-snap-stop: always;
        }
        .slide-item:hover { border-color: #fff; }
        .slide-media { width: 100%; height: 500px; object-fit: contain; display: block; background-color: #000; pointer-events: none; }
        
        .caption { width: 100%; background: #121212; padding: 18px 22px; box-sizing: border-box; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 6px; }
        .caption div:first-child { color: #e0e0e0; font-size: 0.95rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .caption span { font-size: 0.75rem !important; color: #555 !important; font-family: sans-serif; }

        .slider-btn { position: absolute; top: 250px; transform: translateY(-50%); background: rgba(0,0,0,0.9); color: #fff; border: 1px solid #555; width: 50px; height: 50px; cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center; font-size: 24px;}
        .prev-btn { left: 20px; } .next-btn { right: 20px; }

        /* --- LIGHTBOX --- */
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; }
        .lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .lb-main-media { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; }

        @media (max-width: 768px) { 
            header { padding: 1.5rem 1rem; }
            section { max-width: 90%; }
            .info-grid { grid-template-columns: 1fr; }
            .slide-item { min-width: 85vw; }
            .slide-media { height: 300px; }
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <canvas id="particle-canvas"></canvas>
        <div id="loader-slogan">FROM CHAOS TO COSMOS</div>
    </div>

    <header>
        <div class="logo" id="logo">COSMOS.LAB</div>
        <nav id="menu"></nav>
    </header>

    <section id="about-section">
        <div class="info-grid">
            <div><h2 id="who-title"></h2><p id="who-text"></p></div>
            <div><h2 id="what-title"></h2><p id="what-text"></p></div>
        </div>
    </section>

    <section id="projects-section">
        <h2>SELECTED PROJECTS</h2>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('project-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="project-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('project-slider', 1)">&#10095;</button>
        </div>
    </section>

    <section id="automation-section">
        <h2 id="auto-title"></h2>
        <p id="auto-desc"></p>
        <div class="slider-container">
            <button class="slider-btn prev-btn" onclick="manualScroll('auto-slider', -1)">&#10094;</button>
            <div class="slider-wrapper" id="auto-slider"></div>
            <button class="slider-btn next-btn" onclick="manualScroll('auto-slider', 1)">&#10095;</button>
        </div>
    </section>

    <script src="content.js"></script>
    <script>
        // --- LOADER LOGIC (THE HEART) ---
        let loadFinished = false;
        const FORCED_LIMIT = 4000; // Maksimum 4 saniye bekleme (site iskeleti için)

        function finishLoading() {
            if (loadFinished) return;
            loadFinished = true;
            targetProgress = 1.0;
            
            // Animasyon adımları
            setTimeout(() => { document.body.classList.add('slogan-visible'); }, 600); 
            setTimeout(() => { document.body.classList.add('loaded'); }, 1500); // Toplam max 5.5 - 6 saniye
        }

        // Ya her şey yüklenince ya da 4 saniye dolunca bitir
        window.addEventListener('load', finishLoading);
        setTimeout(finishLoading, FORCED_LIMIT);

        // --- PARTICLE ENGINE (Optimized) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Performans için alpha false
        let particlesArray = [];
        let loadProgress = 0.0;
        let targetProgress = 0.0;
        let mainText = "COSMOS.LAB STUDIO";

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();

        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX; this.targetY = targetY;
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speed = 0.05 + Math.random() * 0.05;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + loadProgress * 0.6})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            update() {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                this.x += dx * this.speed;
                this.y += dy * this.speed;
            }
        }

        function initParticles() {
            particlesArray = [];
            const fontSize = Math.min(window.innerWidth / 10, 70);
            ctx.font = `900 ${fontSize}px 'Courier New', monospace`;
            const textWidth = ctx.measureText(mainText).width;
            const startX = (canvas.width - textWidth) / 2;
            const startY = canvas.height / 2;
            
            ctx.fillStyle = 'white';
            ctx.fillText(mainText, startX, startY);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const step = window.innerWidth < 768 ? 5 : 3; // Mobilde daha az partikül
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                        particlesArray.push(new Particle(x, y));
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (loadProgress < targetProgress) loadProgress += 0.015; // Daha hızlı dolum

            particlesArray.forEach(p => { p.update(); p.draw(); });
            
            if (!document.body.classList.contains('loaded')) {
                requestAnimationFrame(animate);
            }
        }

        let simulationInterval = setInterval(() => {
            if(targetProgress < 0.7) targetProgress += 0.05;
        }, 100);

        initParticles();
        animate();

        // --- CONTENT LOADER ---
        document.getElementById('logo').innerText = siteContent.header.title;
        const nav = document.getElementById('menu');
        siteContent.header.menu.forEach(item => {
            nav.innerHTML += `<a href="${item.link}">${item.text}</a>`;
        });
        document.getElementById('who-title').innerText = siteContent.about.whoWeAreTitle;
        document.getElementById('who-text').innerText = siteContent.about.whoWeAreText;
        document.getElementById('what-title').innerText = siteContent.about.whatWeDoTitle;
        document.getElementById('what-text').innerText = siteContent.about.whatWeDoText;
        document.getElementById('auto-title').innerText = siteContent.automation.title;
        document.getElementById('auto-desc').innerText = siteContent.automation.description;

        // --- SLIDER RENDERER (Lazy Loading Integrated) ---
        let allImages = [];
        function renderSlider(wrapperId, dataItems) {
            const wrapper = document.getElementById(wrapperId);
            dataItems.forEach((item) => {
                let startIndex = allImages.length;
                item.images.forEach(img => allImages.push(img));
                const first = item.images[0];
                const isVid = first.endsWith('.mp4');
                
                wrapper.innerHTML += `
                    <div class="slide-item" onclick="openLightbox(${startIndex})">
                        ${isVid ? `<video src="${first}" class="slide-media" autoplay loop muted playsinline preload="metadata"></video>` 
                               : `<img src="${first}" class="slide-media" loading="lazy">`}
                        <div class="caption"><div>${item.title}</div><span>[${item.images.length} items]</span></div>
                    </div>`;
            });
        }
        renderSlider('project-slider', siteContent.projects);
        renderSlider('auto-slider', siteContent.automation.items);

        function manualScroll(id, dir) {
            const el = document.getElementById(id);
            const amt = el.querySelector('.slide-item').offsetWidth + 20;
            el.scrollBy({ left: dir * amt, behavior: 'smooth' });
        }
    </script>
</body>
</html>
